<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wild Thing Audio Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #0f0f13;
            color: #e0e0e0;
        }
        h1, h2, h3, .brand-font {
            font-family: 'Cinzel', serif;
        }
        /* Custom Range Slider Styling */
        input[type=range] {
            -webkit-appearance: none; 
            background: transparent; 
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #d946ef;
            cursor: pointer;
            margin-top: -6px; 
            box-shadow: 0 0 10px rgba(217, 70, 239, 0.5);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #333;
            border-radius: 2px;
        }
        .fx-btn.active {
            background-color: #d946ef;
            color: white;
            box-shadow: 0 0 15px rgba(217, 70, 239, 0.4);
            border-color: #d946ef;
        }
        canvas {
            width: 100%;
            height: 100%;
        }
        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1a1a1a; 
        }
        ::-webkit-scrollbar-thumb {
            background: #444; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #d946ef; 
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4 md:p-8">

    <!-- Header -->
    <header class="text-center mb-8">
        <h1 class="text-4xl md:text-6xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-fuchsia-500 to-purple-600 mb-2">Wild Thing</h1>
        <p class="text-gray-400 italic text-sm md:text-base">Audio Studio & DSP Rack</p>
    </header>

    <!-- Main Container -->
    <main class="w-full max-w-5xl grid grid-cols-1 lg:grid-cols-3 gap-6">

        <!-- Left Column: Player & Visuals -->
        <div class="lg:col-span-2 space-y-6">
            
            <!-- Player Card -->
            <div class="bg-gray-900 border border-gray-800 rounded-xl p-6 shadow-lg">
                <div class="flex items-center justify-between mb-4">
                    <div>
                        <h2 class="text-xl font-semibold text-white">Now Playing</h2>
                        <p class="text-xs text-gray-500">Local File or Demo</p>
                    </div>
                    <label class="cursor-pointer bg-gray-800 hover:bg-gray-700 text-xs px-3 py-1 rounded border border-gray-700 transition">
                        Load Audio
                        <input type="file" id="audioInput" accept="audio/*" class="hidden">
                    </label>
                </div>

                <!-- Controls -->
                <div class="flex flex-wrap items-center justify-center gap-4 mb-6">
                    <button id="btnStop" class="p-3 rounded-full bg-gray-800 hover:bg-red-900/50 text-gray-300 hover:text-red-400 transition border border-gray-700" title="Stop">
                        ■
                    </button>
                    <button id="btnSkipBack" class="p-3 rounded-full bg-gray-800 hover:bg-gray-700 text-gray-300 transition border border-gray-700" title="-5s">
                        ◀ 5s
                    </button>
                    <button id="btnPlayPause" class="p-4 rounded-full bg-fuchsia-600 hover:bg-fuchsia-500 text-white shadow-lg shadow-fuchsia-900/50 transition transform hover:scale-105" title="Play/Pause">
                        ▶
                    </button>
                    <button id="btnSkipFwd" class="p-3 rounded-full bg-gray-800 hover:bg-gray-700 text-gray-300 transition border border-gray-700" title="+5s">
                        5s ▶
                    </button>
                </div>

                <!-- Progress & Volume -->
                <div class="space-y-4">
                    <div class="flex items-center gap-3">
                        <span id="currentTime" class="text-xs font-mono w-10 text-right">00:00</span>
                        <input type="range" id="seekSlider" min="0" max="100" value="0" class="w-full h-1 bg-gray-700 rounded-lg appearance-none cursor-pointer">
                        <span id="duration" class="text-xs font-mono w-10">00:00</span>
                    </div>
                    
                    <div class="flex items-center gap-3">
                        <span class="text-xs text-gray-500">VOL</span>
                        <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.8" class="w-24">
                    </div>
                </div>
            </div>

            <!-- Spectrum Analyzer -->
            <div class="bg-black border border-gray-800 rounded-xl p-1 h-48 relative overflow-hidden shadow-inner">
                <div class="absolute top-2 left-2 text-[10px] text-gray-600 font-mono z-10">SPECTRUM ANALYZER</div>
                <canvas id="visualizer"></canvas>
            </div>

            <!-- Lyrics Section -->
            <div class="bg-gray-900 border border-gray-800 rounded-xl p-6 shadow-lg">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-semibold text-gray-300">Lyrics Editor</h3>
                    <button id="copyLyrics" class="text-xs bg-gray-800 hover:bg-gray-700 px-3 py-1 rounded border border-gray-700 transition">Copy Lyrics</button>
                </div>
                <textarea id="lyricsInput" class="w-full h-32 bg-gray-950 border border-gray-800 rounded p-3 text-sm text-gray-300 focus:outline-none focus:border-fuchsia-500 resize-none font-mono" placeholder="Paste lyrics here...">And this is what the lady had to say...</textarea>
                <div class="mt-4 p-4 bg-gray-950 rounded border border-gray-800 min-h-[60px]">
                    <p class="text-xs text-gray-500 mb-1">Beautiful Preview</p>
                    <p id="lyricsPreview" class="text-fuchsia-400 font-medium italic">Lyrics will appear here...</p>
                </div>
            </div>
        </div>

        <!-- Right Column: DSP Rack -->
        <div class="lg:col-span-1">
            <div class="bg-gray-900 border border-gray-800 rounded-xl p-6 shadow-lg h-full">
                <h2 class="text-xl font-bold text-gray-200 mb-6 border-b border-gray-800 pb-2 brand-font">DSP FX RACK</h2>
                
                <div class="space-y-6">
                    <!-- Speed -->
                    <div class="control-group">
                        <div class="flex justify-between text-xs text-gray-400 mb-1">
                            <span>Speed</span>
                            <span id="speedVal">1.00x</span>
                        </div>
                        <input type="range" id="speedSlider" min="0.5" max="2.0" step="0.05" value="1.0" class="w-full">
                    </div>

                    <!-- Bass Boost -->
                    <div class="control-group">
                        <div class="flex justify-between text-xs text-gray-400 mb-1">
                            <span>Bass Boost</span>
                            <span id="bassVal">0 dB</span>
                        </div>
                        <input type="range" id="bassSlider" min="0" max="20" step="1" value="0" class="w-full">
                    </div>

                    <!-- Treble EQ -->
                    <div class="control-group">
                        <div class="flex justify-between text-xs text-gray-400 mb-1">
                            <span>Treble EQ</span>
                            <span id="trebleVal">0 dB</span>
                        </div>
                        <input type="range" id="trebleSlider" min="-10" max="10" step="1" value="0" class="w-full">
                    </div>

                    <hr class="border-gray-800 my-4">

                    <!-- Toggle Effects -->
                    <div class="grid grid-cols-2 gap-3">
                        <button class="fx-btn px-3 py-2 rounded border border-gray-700 bg-gray-800 text-xs text-gray-400 hover:bg-gray-700 transition" data-fx="reverb">Reverb</button>
                        <button class="fx-btn px-3 py-2 rounded border border-gray-700 bg-gray-800 text-xs text-gray-400 hover:bg-gray-700 transition" data-fx="tape">Tape Echo</button>
                        <button class="fx-btn px-3 py-2 rounded border border-gray-700 bg-gray-800 text-xs text-gray-400 hover:bg-gray-700 transition" data-fx="8d">8D Audio</button>
                        <button class="fx-btn px-3 py-2 rounded border border-gray-700 bg-gray-800 text-xs text-gray-400 hover:bg-gray-700 transition" data-fx="phaser">Phaser</button>
                        <button class="fx-btn px-3 py-2 rounded border border-gray-700 bg-gray-800 text-xs text-gray-400 hover:bg-gray-700 transition" data-fx="flanger">Flanger</button>
                        <button class="fx-btn px-3 py-2 rounded border border-gray-700 bg-gray-800 text-xs text-gray-400 hover:bg-gray-700 transition" data-fx="tremolo">Tremolo</button>
                        <button class="fx-btn px-3 py-2 rounded border border-gray-700 bg-gray-800 text-xs text-gray-400 hover:bg-gray-700 transition" data-fx="bitcrusher">Bitcrusher</button>
                        <button class="fx-btn px-3 py-2 rounded border border-gray-700 bg-gray-800 text-xs text-gray-400 hover:bg-gray-700 transition" data-fx="compressor">Compressor</button>
                    </div>
                    
                    <div class="mt-4 p-3 bg-gray-950 rounded border border-gray-800 text-[10px] text-gray-500 font-mono">
                        Status: <span id="statusText" class="text-green-500">Ready</span>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <script>
        // --- Audio Context & State ---
        let audioCtx;
        let sourceNode;
        let gainNode;
        let analyser;
        
        // Filter Nodes
        let bassFilter;
        let trebleFilter;
        
        // Effect Nodes
        let reverbNode;
        let delayNode; // Used for Tape/Echo
        let delayFeedback;
        let compressorNode;
        let bitCrusherNode; // WaveShaper
        let tremoloGain;
        let tremoloOsc;
        
        // State
        let isPlaying = false;
        let audioBuffer = null;
        let startTime = 0;
        let pauseTime = 0;
        let duration = 0;
        
        // Active Effects Map
        const activeFX = {
            reverb: false,
            tape: false,
            '8d': false,
            phaser: false,
            flanger: false,
            tremolo: false,
            bitcrusher: false,
            compressor: false
        };

        // DOM Elements
        const btnPlayPause = document.getElementById('btnPlayPause');
        const btnStop = document.getElementById('btnStop');
        const btnSkipBack = document.getElementById('btnSkipBack');
        const btnSkipFwd = document.getElementById('btnSkipFwd');
        const seekSlider = document.getElementById('seekSlider');
        const volumeSlider = document.getElementById('volumeSlider');
        const speedSlider = document.getElementById('speedSlider');
        const bassSlider = document.getElementById('bassSlider');
        const trebleSlider = document.getElementById('trebleSlider');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');
        const statusText = document.getElementById('statusText');
        const audioInput = document.getElementById('audioInput');
        const canvas = document.getElementById('visualizer');
        const canvasCtx = canvas.getContext('2d');

        // --- Initialization ---

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
                
                // Create Master Gain
                gainNode = audioCtx.createGain();
                gainNode.gain.value = 0.8;

                // Create Analyser
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256;

                // Create Filters
                bassFilter = audioCtx.createBiquadFilter();
                bassFilter.type = 'lowshelf';
                bassFilter.frequency.value = 200;

                trebleFilter = audioCtx.createBiquadFilter();
                trebleFilter.type = 'highshelf';
                trebleFilter.frequency.value = 3000;

                // Create Compressor
                compressorNode = audioCtx.createDynamicsCompressor();
                compressorNode.threshold.value = -24;
                compressorNode.knee.value = 30;
                compressorNode.ratio.value = 12;
                compressorNode.attack.value = 0.003;
                compressorNode.release.value = 0.25;

                // Create Delay (for Tape/8D)
                delayNode = audioCtx.createDelay();
                delayNode.delayTime.value = 0.3; // 300ms
                delayFeedback = audioCtx.createGain();
                delayFeedback.gain.value = 0.4;

                // Create Tremolo Oscillator/Gain
                tremoloGain = audioCtx.createGain();
                tremoloOsc = audioCtx.createOscillator();
                tremoloOsc.type = 'sine';
                tremoloOsc.frequency.value = 4; // 4Hz tremolo
                tremoloOsc.connect(tremoloGain.gain);
                tremoloOsc.start();

                // Create Bitcrusher (WaveShaper)
                bitCrusherNode = audioCtx.createWaveShaper();
                updateBitCrusherCurve(8); // Default 8-bit simulation

                // Generate Reverb Impulse
                createReverbImpulse();

                statusText.innerText = "Audio Engine Ready";
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // --- Reverb Impulse Generation ---
        function createReverbImpulse() {
            const rate = audioCtx.sampleRate;
            const length = rate * 2.0; // 2 seconds
            const decay = 2.0;
            const impulse = audioCtx.createBuffer(2, length, rate);
            const left = impulse.getChannelData(0);
            const right = impulse.getChannelData(1);

            for (let i = 0; i < length; i++) {
                const n = i / length;
                // Simple exponential decay noise
                left[i] = (Math.random() * 2 - 1) * Math.pow(1 - n, decay);
                right[i] = (Math.random() * 2 - 1) * Math.pow(1 - n, decay);
            }
            
            reverbNode = audioCtx.createConvolver();
            reverbNode.buffer = impulse;
        }

        // --- Bitcrusher Curve ---
        function updateBitCrusherCurve(bits) {
            const steps = Math.pow(2, bits - 1);
            const curve = new Float32Array(audioCtx.sampleRate); // Size doesn't strictly matter for Waveshaper mapping but usually matches buffer size or is small
            // Actually, for waveshaper, we map -1 to 1.
            const samples = 44100; 
            const distCurve = new Float32Array(samples);
            for (let i = 0; i < samples; i++) {
                const x = (i * 2) / samples - 1;
                // Quantize
                distCurve[i] = Math.round(x * steps) / steps;
            }
            bitCrusherNode.curve = distCurve;
        }

        // --- File Loading ---
        audioInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            initAudio();
            statusText.innerText = "Decoding...";
            
            const arrayBuffer = await file.arrayBuffer();
            try {
                audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                duration = audioBuffer.duration;
                durationEl.innerText = formatTime(duration);
                seekSlider.max = duration;
                statusText.innerText = "Loaded: " + file.name;
                stopAudio(); // Reset if playing
                pauseTime = 0;
                updateTimeDisplay();
            } catch (err) {
                console.error(err);
                statusText.innerText = "Error decoding audio";
            }
        });

        // --- Playback Control ---

        function playAudio() {
            if (!audioBuffer) return;
            
            // If already playing, do nothing (or pause first)
            if (isPlaying) return;

            sourceNode = audioCtx.createBufferSource();
            sourceNode.buffer = audioBuffer;
            sourceNode.playbackRate.value = parseFloat(speedSlider.value);

            // Connect Graph
            // Source -> Bass -> Treble -> [Effects Chain] -> Gain -> Analyser -> Destination
            
            let currentNode = sourceNode;

            // 1. Filters
            currentNode.connect(bassFilter);
            currentNode = bassFilter;
            
            currentNode.connect(trebleFilter);
            currentNode = trebleFilter;

            // 2. Effects Routing (Simple Series for demo, some parallel would be better for complex mixes)
            
            // Compressor
            if (activeFX.compressor) {
                currentNode.connect(compressorNode);
                currentNode = compressorNode;
            }

            // Bitcrusher
            if (activeFX.bitcrusher) {
                currentNode.connect(bitCrusherNode);
                currentNode = bitCrusherNode;
            }

            // Tremolo
            if (activeFX.tremolo) {
                // We need to modulate the gain of the signal
                // Create a temporary gain node for tremolo if not using global
                const tremoloEffectGain = audioCtx.createGain();
                tremoloEffectGain.gain.value = 1.0;
                // Modulate it
                const osc = audioCtx.createOscillator();
                osc.frequency.value = 5;
                osc.connect(tremoloEffectGain.gain);
                osc.start();
                
                currentNode.connect(tremoloEffectGain);
                currentNode = tremoloEffectGain;
            }

            // Reverb (Parallel mix usually, but here series for simplicity or use dry/wet)
            // Let's do a simple dry/wet mix for Reverb
            if (activeFX.reverb) {
                const dryGain = audioCtx.createGain();
                const wetGain = audioCtx.createGain();
                dryGain.gain.value = 0.7;
                wetGain.gain.value = 0.3;
                
                currentNode.connect(dryGain);
                currentNode.connect(reverbNode);
                reverbNode.connect(wetGain);
                
                // Merge
                const merger = audioCtx.createChannelMerger(2); // Not really needed if mono/stereo handled by context
                // Simpler: Connect both to next node
                dryGain.connect(gainNode);
                wetGain.connect(gainNode);
                
                // Bypass standard chain end for this branch
                currentNode = null; 
            } else {
                // Continue chain
            }

            // Delay (Tape/8D)
            if (activeFX.tape || activeFX['8d']) {
                // Create delay loop
                const feedbackGain = audioCtx.createGain();
                feedbackGain.gain.value = activeFX.tape ? 0.4 : 0.7;
                
                const delay = audioCtx.createDelay();
                delay.delayTime.value = activeFX['8d'] ? 0.02 : 0.25; // Shorter for 8D phasing effect, longer for tape

                // Send to delay
                currentNode.connect(delay);
                delay.connect(feedbackGain);
                feedbackGain.connect(delay); // Loop
                delay.connect(gainNode); // Wet out
            }

            if (currentNode) {
                currentNode.connect(gainNode);
            }

            gainNode.connect(analyser);
            analyser.connect(audioCtx.destination);

            sourceNode.start(0, pauseTime);
            startTime = audioCtx.currentTime - pauseTime;
            isPlaying = true;
            btnPlayPause.innerHTML = "⏸";
            statusText.innerText = "Playing";
            
            requestAnimationFrame(updateProgress);
            drawVisualizer();
        }

        function pauseAudio() {
            if (!isPlaying) return;
            sourceNode.stop();
            pauseTime = audioCtx.currentTime - startTime;
            isPlaying = false;
            btnPlayPause.innerHTML = "▶";
            statusText.innerText = "Paused";
        }

        function stopAudio() {
            if (isPlaying) {
                sourceNode.stop();
                isPlaying = false;
            }
            pauseTime = 0;
            btnPlayPause.innerHTML = "▶";
            updateTimeDisplay();
            statusText.innerText = "Stopped";
        }

        // --- Event Listeners ---

        btnPlayPause.addEventListener('click', () => {
            initAudio();
            if (isPlaying) pauseAudio();
            else playAudio();
        });

        btnStop.addEventListener('click', stopAudio);

        btnSkipBack.addEventListener('click', () => {
            if (!audioBuffer) return;
            pauseTime = Math.max(0, pauseTime - 5);
            if (isPlaying) {
                sourceNode.stop();
                playAudio(); // Restart with new offset
            } else {
                updateTimeDisplay();
            }
        });

        btnSkipFwd.addEventListener('click', () => {
            if (!audioBuffer) return;
            pauseTime = Math.min(duration, pauseTime + 5);
            if (isPlaying) {
                sourceNode.stop();
                playAudio();
            } else {
                updateTimeDisplay();
            }
        });

        seekSlider.addEventListener('input', (e) => {
            if (!audioBuffer) return;
            pauseTime = parseFloat(e.target.value);
            if (isPlaying) {
                sourceNode.stop();
                playAudio();
            } else {
                updateTimeDisplay();
            }
        });

        volumeSlider.addEventListener('input', (e) => {
            if (gainNode) gainNode.gain.value = parseFloat(e.target.value);
        });

        speedSlider.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            document.getElementById('speedVal').innerText = val.toFixed(2) + 'x';
            if (sourceNode && isPlaying) {
                sourceNode.playbackRate.value = val;
            }
        });

        bassSlider.addEventListener('input', (e) => {
            const val = parseInt(e.target.value);
            document.getElementById('bassVal').innerText = val + ' dB';
            if (bassFilter) bassFilter.gain.value = val;
        });

        trebleSlider.addEventListener('input', (e) => {
            const val = parseInt(e.target.value);
            document.getElementById('trebleVal').innerText = val + ' dB';
            if (trebleFilter) trebleFilter.gain.value = val;
        });

        // FX Buttons
        document.querySelectorAll('.fx-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const fx = btn.dataset.fx;
                activeFX[fx] = !activeFX[fx];
                btn.classList.toggle('active');
                
                // If playing, restart to apply graph changes (simplest way for this demo)
                if (isPlaying) {
                    const currentPos = audioCtx.currentTime - startTime;
                    sourceNode.stop();
                    pauseTime = currentPos;
                    playAudio();
                }
            });
        });

        // --- Helpers ---

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        function updateTimeDisplay() {
            currentTimeEl.innerText = formatTime(pauseTime);
            seekSlider.value = pauseTime;
        }

        function updateProgress() {
            if (!isPlaying) return;
            const current = audioCtx.currentTime - startTime;
            if (current >= duration) {
                stopAudio();
                return;
            }
            currentTimeEl.innerText = formatTime(current);
            seekSlider.value = current;
            requestAnimationFrame(updateProgress);
        }

        // --- Visualizer ---
        function drawVisualizer() {
            if (!analyser) return;
            
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            
            const WIDTH = canvas.width;
            const HEIGHT = canvas.height;

            function draw() {
                if (!isPlaying) {
                    // Clear canvas if stopped
                    canvasCtx.fillStyle = 'rgb(0, 0, 0)';
                    canvasCtx.fillRect(0, 0, WIDTH, HEIGHT);
                    return;
                }

                requestAnimationFrame(draw);

                analyser.getByteFrequencyData(dataArray);

                canvasCtx.fillStyle = 'rgb(0, 0, 0)';
                canvasCtx.fillRect(0, 0, WIDTH, HEIGHT);

                const barWidth = (WIDTH / bufferLength) * 2.5;
                let barHeight;
                let x = 0;

                for(let i = 0; i < bufferLength; i++) {
                    barHeight = dataArray[i] / 2; // Scale down

                    // Gradient color based on height
                    const r = barHeight + (25 * (i/bufferLength));
                    const g = 250 * (i/bufferLength);
                    const b = 255;

                    canvasCtx.fillStyle = `rgb(${r},${g},${b})`;
                    canvasCtx.fillRect(x, HEIGHT - barHeight, barWidth, barHeight);

                    x += barWidth + 1;
                }
            }
            draw();
        }

        // Resize canvas
        function resizeCanvas() {
            canvas.width = canvas.parentElement.offsetWidth;
            canvas.height = canvas.parentElement.offsetHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // --- Lyrics Logic ---
        const lyricsInput = document.getElementById('lyricsInput');
        const lyricsPreview = document.getElementById('lyricsPreview');
        const copyBtn = document.getElementById('copyLyrics');

        lyricsInput.addEventListener('input', (e) => {
            lyricsPreview.innerText = e.target.value || "Lyrics will appear here...";
        });

        copyBtn.addEventListener('click', () => {
            lyricsInput.select();
            document.execCommand('copy');
            copyBtn.innerText = "Copied!";
            setTimeout(() => copyBtn.innerText = "Copy Lyrics", 2000);
        });

    </script>
</body>
</html>
