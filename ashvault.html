<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ashvault</title>
<meta name="description" content="Ashvault — a dark industrial first-person descent. Flashlight, doors, and things that walk.">
<meta name="theme-color" content="#0c0b0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{
  --bg:#0c0b0a; --fg:#e8e2d6; --muted:#8a8278; --accent:#c2412d;
  --accent-deep:#7a2418; --ammo:#3dba8b; --panel:#141210; --line:#2a2622;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden;touch-action:none;font-family:"IBM Plex Mono",ui-monospace,monospace}
button{cursor:pointer;font:inherit}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
header{display:flex;justify-content:space-between;align-items:baseline;padding:8px 16px 4px;flex-shrink:0}
h1{margin:0;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:24px;letter-spacing:.18em;color:var(--accent)}
.tag{margin:0;font-size:10px;letter-spacing:.22em;color:var(--muted)}
#stage{position:relative;flex:1;min-height:0}
#host{position:absolute;inset:0}
#host canvas{display:block}
.vign{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 42%,rgba(0,0,0,.55) 100%)}
#hit{position:absolute;inset:0;pointer-events:none;background:rgba(194,65,45,.25)}
.hidden{display:none!important}
.crosshair{position:absolute;top:42%;left:50%;width:12px;height:12px;transform:translate(-50%,-50%);pointer-events:none}
.crosshair::before,.crosshair::after{content:"";position:absolute;background:rgba(232,226,214,.8)}
.crosshair::before{top:0;left:50%;width:1px;height:12px;transform:translateX(-50%)}
.crosshair::after{top:50%;left:0;height:1px;width:12px;transform:translateY(-50%)}
#stats{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;padding:0 16px 12px;pointer-events:none}
.stat{display:flex;flex-direction:column;align-items:center}
.stat .lbl{font-size:9px;letter-spacing:.18em;color:var(--muted)}
.stat .val{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:24px}
#menu{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;background:rgba(12,11,10,.8)}
#menuTitle{margin:0;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:48px;letter-spacing:.16em;color:var(--accent)}
#menuMsg{margin:0;max-width:320px;font-size:12px;line-height:1.6;color:var(--muted)}
#startBtn{background:var(--accent);color:var(--fg);border:0;padding:12px 32px;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:18px;letter-spacing:.2em}
#touch{height:34vh;max-height:240px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);background:var(--panel);padding:8px 16px 12px}
@media (pointer:fine){#touch{display:none}}
.dpad{display:grid;grid-template-columns:repeat(3,auto);grid-template-rows:repeat(2,auto);gap:8px}
.pad{width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:16px;user-select:none;-webkit-user-select:none;touch-action:none}
.actions{display:flex;flex-direction:column;align-items:center;gap:12px}
.fire{width:80px;height:80px;border-radius:50%;border:2px solid var(--accent);background:var(--accent-deep);color:var(--fg);font-family:"Barlow Condensed",sans-serif;font-weight:700;letter-spacing:.15em;font-size:14px;user-select:none;-webkit-user-select:none;touch-action:none}
.open{width:80px;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-family:"Barlow Condensed",sans-serif;font-weight:700;letter-spacing:.15em;font-size:14px;user-select:none;-webkit-user-select:none;touch-action:none}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>ASHVAULT</h1>
    <p class="tag">INDUSTRIAL DESCENT</p>
  </header>

  <div id="stage">
    <div id="host"></div>
    <div class="vign"></div>
    <div id="hit" class="hidden"></div>
    <div class="crosshair"></div>

    <div id="stats">
      <div class="stat"><span class="lbl">AMMO</span><span class="val" id="ammo" style="color:var(--ammo)">50</span></div>
      <div class="stat"><span class="lbl">HEALTH</span><span class="val" id="health" style="color:var(--accent)">100%</span></div>
      <div class="stat"><span class="lbl">KILLS</span><span class="val" id="kills">0</span></div>
    </div>

    <div id="menu">
      <p id="menuTitle">ASHVAULT</p>
      <p id="menuMsg">Swipe the view to look. Move with the pad. Stay in the light and clear the halls.</p>
      <button id="startBtn" type="button">START</button>
    </div>
  </div>

  <section id="touch">
    <div class="dpad">
      <span></span>
      <button class="pad" type="button" data-key="KeyW" aria-label="Forward">▲</button>
      <span></span>
      <button class="pad" type="button" data-key="KeyA" aria-label="Left">◀</button>
      <button class="pad" type="button" data-key="KeyS" aria-label="Back">▼</button>
      <button class="pad" type="button" data-key="KeyD" aria-label="Right">▶</button>
    </div>
    <div class="actions">
      <button class="fire" type="button" data-key="ControlLeft" aria-label="Fire">FIRE</button>
      <button class="open" type="button" data-key="Space" aria-label="Open door">OPEN</button>
    </div>
  </section>
</div>

<script>
(function () {
  "use strict";

  // ---------- Constants (ported from src/game/mount-ashvault.ts) ----------
  const CELL = 4;
  const WALL_H = 3.2;
  const EYE = 1.62;
  const RADIUS = 0.38;
  const MOVE = 4.6;
  const LOOK = 0.0024;
  const TOUCH_LOOK = 0.0055;

  // S = spawn, E = enemy, D = door, # = wall, . = floor
  const ROWS = [
    "########################",
    "#......................#",
    "#S.....................#",
    "#..######..######..E...#",
    "#..#....#..#....#......#",
    "#..#..E.#..#....#......#",
    "#..#....####....D......#",
    "#..#............#......#",
    "#..##############......#",
    "#..........E...........#",
    "#......................#",
    "#..##################..#",
    "#........E.............#",
    "#......................#",
    "########################",
  ];
  const MAP_H = ROWS.length;
  const MAP_W = ROWS[0].length;

  const host = document.getElementById("host");
  const $ = (id) => document.getElementById(id);

  // ---------- State ----------
  const keys = new Set();
  const doors = new Map();
  const enemies = [];
  let phase = "menu";
  let health = 100;
  let ammo = 50;
  let kills = 0;
  let hitFlash = 0;
  let invuln = 0;
  let fireCd = 0;
  let shake = 0;
  let bob = 0;
  let yaw = Math.PI / 2;
  let pitch = 0;
  let lastHud = "";
  let spawnX = CELL * 2.5;
  let spawnZ = CELL * 2.5;
  const spawnYaw = -Math.PI / 2;

  // ---------- Renderer / scene ----------
  const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
  renderer.setSize(host.clientWidth || 1, host.clientHeight || 1);
  renderer.setClearColor(0x1a1612, 1);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFShadowMap;
  host.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1a1612);
  scene.fog = new THREE.Fog(0x1a1612, 10, 46);

  const camera = new THREE.PerspectiveCamera(72, 1, 0.08, 80);
  const player = new THREE.Group();
  player.add(camera);
  scene.add(player);

  const flash = new THREE.SpotLight(0xfff1dc, 18, 32, 0.62, 0.42, 1);
  flash.castShadow = true;
  flash.shadow.mapSize.set(512, 512);
  flash.shadow.bias = -0.0004;
  camera.add(flash);
  flash.position.set(0.15, -0.05, 0.1);
  flash.target.position.set(0, -0.08, -1);
  camera.add(flash.target);

  scene.add(new THREE.AmbientLight(0xb9aea2, 0.42));
  scene.add(new THREE.HemisphereLight(0xc8beb0, 0x2a221c, 0.55));

  // ---------- Procedural textures (no image files needed) ----------
  function makeTex(paint, repeatX, repeatY) {
    const s = 128;
    const c = document.createElement("canvas");
    c.width = s;
    c.height = s;
    const g = c.getContext("2d");
    paint(g, s);
    const t = new THREE.CanvasTexture(c);
    t.encoding = THREE.sRGBEncoding;
    t.wrapS = THREE.RepeatWrapping;
    t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(repeatX || 1, repeatY || 1);
    t.anisotropy = 4;
    return t;
  }

  const floorTex = makeTex((g, s) => {
    g.fillStyle = "#3a342c"; g.fillRect(0, 0, s, s);
    g.fillStyle = "#2a251f"; g.fillRect(6, 6, s - 12, s - 12);
    g.strokeStyle = "#4a433a"; g.strokeRect(1, 1, s - 2, s - 2);
  }, MAP_W, MAP_H);

  const wallTex = makeTex((g, s) => {
    g.fillStyle = "#4a4038"; g.fillRect(0, 0, s, s);
    g.fillStyle = "#3a322c";
    for (let y = 0; y < s; y += 16) {
      g.fillRect(0, y, s, 2);
      const off = (y / 16) % 2 === 0 ? 0 : 32;
      for (let x = off; x < s; x += 64) g.fillRect(x, y, 2, 16);
    }
    g.fillStyle = "#6a2a22"; g.fillRect(8, 70, 18, 6);
  }, 1, 1);

  const floorMat = new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.92, metalness: 0.04 });
  const wallMat = new THREE.MeshStandardMaterial({ map: wallTex, roughness: 0.86, metalness: 0.08 });
  const ceilMat = new THREE.MeshStandardMaterial({ color: 0x221e1b, roughness: 0.95 });
  const doorMat = new THREE.MeshStandardMaterial({ color: 0x5c4632, roughness: 0.55, metalness: 0.35 });
  const trimMat = new THREE.MeshStandardMaterial({ color: 0xffb080, emissive: 0xff7a3a, emissiveIntensity: 0.8, roughness: 0.4 });

  const floor = new THREE.Mesh(new THREE.PlaneGeometry(MAP_W * CELL, MAP_H * CELL), floorMat);
  floor.rotation.x = -Math.PI / 2;
  floor.position.set((MAP_W * CELL) / 2, 0, (MAP_H * CELL) / 2);
  floor.receiveShadow = true;
  scene.add(floor);

  const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(MAP_W * CELL, MAP_H * CELL), ceilMat);
  ceiling.rotation.x = Math.PI / 2;
  ceiling.position.set((MAP_W * CELL) / 2, WALL_H, (MAP_H * CELL) / 2);
  scene.add(ceiling);

  // ---------- Build the map ----------
  const wallGeo = new THREE.BoxGeometry(CELL, WALL_H, CELL);
  const wallMesh = new THREE.InstancedMesh(wallGeo, wallMat, MAP_W * MAP_H);
  wallMesh.castShadow = true;
  wallMesh.receiveShadow = true;
  const dummy = new THREE.Object3D();
  let wallCount = 0;

  function cellChar(c, r) {
    if (r < 0 || c < 0 || r >= MAP_H || c >= MAP_W) return "#";
    return ROWS[r][c];
  }

  function makeEnemy(x, z) {
    const group = new THREE.Group();
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0x6e2c24, roughness: 0.62, metalness: 0.05, emissive: 0x1a0604 });
    // Torso: cylinder with rounded ends (replaces CapsuleGeometry, which r128 lacks)
    const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.38, 0.38, 0.7, 10), bodyMat);
    torso.position.y = 1.15;
    torso.castShadow = true;
    const shoulderTop = new THREE.Mesh(new THREE.SphereGeometry(0.38, 10, 8), bodyMat);
    shoulderTop.position.y = 1.5;
    const hip = new THREE.Mesh(new THREE.SphereGeometry(0.38, 10, 8), bodyMat);
    hip.position.y = 0.8;
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.26, 10, 8), bodyMat);
    head.position.y = 1.85;
    head.castShadow = true;
    const eyeMat = new THREE.MeshStandardMaterial({ color: 0xff4010, emissive: 0xff4010, emissiveIntensity: 2 });
    const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.05, 6, 6), eyeMat);
    const eyeR = eyeL.clone();
    eyeL.position.set(-0.09, 1.88, 0.2);
    eyeR.position.set(0.09, 1.88, 0.2);
    group.add(torso, shoulderTop, hip, head, eyeL, eyeR);
    group.position.set(x, 0, z);
    scene.add(group);
    group.userData.homeX = x;
    group.userData.homeZ = z;
    return { mesh: group, x: x, z: z, hp: 70, alive: true, flash: 0, body: bodyMat };
  }

  for (let r = 0; r < MAP_H; r++) {
    for (let c = 0; c < MAP_W; c++) {
      const ch = cellChar(c, r);
      const x = c * CELL + CELL / 2;
      const z = r * CELL + CELL / 2;
      if (ch === "S") { spawnX = x; spawnZ = z; }
      if (ch === "#") {
        dummy.position.set(x, WALL_H / 2, z);
        dummy.scale.set(1, 1, 1);
        dummy.rotation.set(0, 0, 0);
        dummy.updateMatrix();
        wallMesh.setMatrixAt(wallCount++, dummy.matrix);
      } else if (ch === "D") {
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(CELL * 0.96, WALL_H * 0.92, 0.28), doorMat);
        mesh.position.set(x, WALL_H * 0.46, z);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        scene.add(mesh);
        doors.set(c + "," + r, { mesh: mesh, open: 0, solid: true });
      } else if (ch === "E") {
        enemies.push(makeEnemy(x, z));
      }
      if ((c + r) % 5 === 0 && ch !== "#") {
        const lamp = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.08, 0.7), trimMat);
        lamp.position.set(x, WALL_H - 0.06, z);
        scene.add(lamp);
        const pl = new THREE.PointLight(0xffc9a0, 1.35, 11, 1.4);
        pl.position.set(x, WALL_H - 0.3, z);
        scene.add(pl);
      }
    }
  }
  wallMesh.count = wallCount;
  wallMesh.instanceMatrix.needsUpdate = true;
  scene.add(wallMesh);

  // ---------- Gun (drawn in its own overlay scene) ----------
  const gunScene = new THREE.Scene();
  const gunCam = new THREE.PerspectiveCamera(50, 1, 0.05, 10);
  const gun = new THREE.Group();
  const steel = new THREE.MeshStandardMaterial({ color: 0x2c2e33, metalness: 0.55, roughness: 0.38 });
  const grip = new THREE.MeshStandardMaterial({ color: 0x4a3020, roughness: 0.8 });
  const gunBody = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.16, 0.55), steel);
  const barrel = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.07, 0.42), steel);
  barrel.position.set(0, 0.08, -0.38);
  const handle = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.22, 0.12), grip);
  handle.position.set(0, -0.16, 0.12);
  handle.rotation.x = 0.35;
  const muzzle = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 6), new THREE.MeshBasicMaterial({ color: 0xffe7a0 }));
  muzzle.position.set(0, 0.08, -0.6);
  muzzle.visible = false;
  gun.add(gunBody, barrel, handle, muzzle);
  gun.position.set(0.34, -0.32, -0.72);
  gunCam.add(gun);
  gunScene.add(gunCam);
  const gunLight = new THREE.PointLight(0xffe0a0, 0, 2);
  gun.add(gunLight);

  // ---------- Player helpers ----------
  function placePlayer(x, z, nextYaw) {
    player.position.set(x, EYE, z);
    yaw = nextYaw;
    pitch = 0;
    player.rotation.y = yaw;
    camera.rotation.x = 0;
  }
  placePlayer(spawnX, spawnZ, spawnYaw);

  function blocked(x, z) {
    const samples = [[x, z], [x + RADIUS, z], [x - RADIUS, z], [x, z + RADIUS], [x, z - RADIUS]];
    for (const s of samples) {
      const c = Math.floor(s[0] / CELL);
      const r = Math.floor(s[1] / CELL);
      const ch = cellChar(c, r);
      if (ch === "#") return true;
      if (ch === "D") {
        const d = doors.get(c + "," + r);
        if (!d || d.solid) return true;
      }
    }
    return false;
  }

  function tryMove(dx, dz) {
    const nx = player.position.x + dx;
    const nz = player.position.z + dz;
    if (!blocked(nx, player.position.z)) player.position.x = nx;
    if (!blocked(player.position.x, nz)) player.position.z = nz;
  }

  function wallDistance(ox, oy, oz, dx, dy, dz) {
    let t = 0.2;
    for (let i = 0; i < 80; i++) {
      t += 0.25;
      const x = ox + dx * t;
      const y = oy + dy * t;
      const z = oz + dz * t;
      if (y < 0.05 || y > WALL_H - 0.05) return t;
      const c = Math.floor(x / CELL);
      const r = Math.floor(z / CELL);
      const ch = cellChar(c, r);
      if (ch === "#") return t;
      if (ch === "D") {
        const door = doors.get(c + "," + r);
        if (!door || door.solid) return t;
      }
      if (t > 36) break;
    }
    return 99;
  }

  // ---------- Audio (Web Audio synth blips, no files) ----------
  let audioCtx = null;
  function ac() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }
  function blip(freq, dur, type, gain) {
    const ctx = ac();
    const t = ctx.currentTime;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * 0.25), t + dur);
    g.gain.setValueAtTime(gain === undefined ? 0.08 : gain, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g);
    g.connect(ctx.destination);
    o.start(t);
    o.stop(t + dur + 0.02);
  }

  // ---------- Actions ----------
  function shoot() {
    if (phase !== "play" || fireCd > 0 || ammo <= 0) {
      if (ammo <= 0 && phase === "play") blip(140, 0.05, "square", 0.04);
      return;
    }
    ammo -= 1;
    fireCd = 0.28;
    shake = 0.12;
    pitch = Math.min(1.15, pitch + 0.03);
    muzzle.visible = true;
    gunLight.intensity = 4;
    blip(160, 0.09, "square", 0.12);

    const dir = new THREE.Vector3();
    camera.getWorldDirection(dir);
    const origin = new THREE.Vector3();
    camera.getWorldPosition(origin);
    const wallT = wallDistance(origin.x, origin.y, origin.z, dir.x, dir.y, dir.z);

    let best = null;
    let bestT = wallT;
    for (const en of enemies) {
      if (!en.alive) continue;
      const ex = en.x - origin.x;
      const ey = 1.3 - origin.y;
      const ez = en.z - origin.z;
      const t = ex * dir.x + ey * dir.y + ez * dir.z;
      if (t < 0.4 || t >= bestT) continue;
      const px = origin.x + dir.x * t;
      const py = origin.y + dir.y * t;
      const pz = origin.z + dir.z * t;
      const ddx = px - en.x;
      const ddy = py - 1.3;
      const ddz = pz - en.z;
      if (ddx * ddx + ddy * ddy + ddz * ddz < 0.55 * 0.55) {
        best = en;
        bestT = t;
      }
    }
    if (best) {
      best.hp -= 28;
      best.flash = 0.16;
      best.body.emissive.setHex(0xffe0d0);
      hitFlash = 0.12;
      blip(90, 0.07, "sawtooth", 0.07);
      if (best.hp <= 0) {
        best.alive = false;
        best.mesh.visible = false;
        kills += 1;
      }
    }
    pushHud(true);
  }

  function openDoor() {
    if (phase !== "play") return;
    const dir = new THREE.Vector3();
    camera.getWorldDirection(dir);
    const x = player.position.x + dir.x * 1.6;
    const z = player.position.z + dir.z * 1.6;
    const key = Math.floor(x / CELL) + "," + Math.floor(z / CELL);
    const door = doors.get(key);
    if (door && door.open < 0.02) {
      door.open = 0.01;
      blip(90, 0.28, "triangle", 0.06);
    }
  }

  function reset() {
    health = 100;
    ammo = 50;
    kills = 0;
    invuln = 1.6;
    fireCd = 0;
    shake = 0;
    for (const en of enemies) {
      en.alive = true;
      en.hp = 70;
      en.flash = 0;
      en.mesh.visible = true;
      en.body.emissive.setHex(0x1a0604);
      en.x = en.mesh.userData.homeX;
      en.z = en.mesh.userData.homeZ;
      en.mesh.position.set(en.x, 0, en.z);
    }
    for (const d of doors.values()) {
      d.open = 0;
      d.solid = true;
      d.mesh.position.y = WALL_H * 0.46;
    }
    placePlayer(spawnX, spawnZ, spawnYaw);
  }

  // ---------- HUD ----------
  function renderHud(h) {
    $("ammo").textContent = String(h.ammo);
    $("health").textContent = Math.round(h.health) + "%";
    $("kills").textContent = String(h.kills);
    $("hit").classList.toggle("hidden", !h.hit);
    $("menu").classList.toggle("hidden", h.phase === "play");
    $("menuTitle").textContent = h.phase === "dead" ? "FLATLINED" : "ASHVAULT";
    $("menuMsg").textContent = h.phase === "dead"
      ? "Kills " + h.kills + ". The vault is still open."
      : "Swipe the view to look. Move with the pad. Stay in the light and clear the halls.";
    $("startBtn").textContent = h.phase === "dead" ? "RESPAWN" : "START";
  }

  function pushHud(force) {
    const snap = (health | 0) + "|" + ammo + "|" + kills + "|" + phase + "|" + (hitFlash > 0 ? 1 : 0);
    if (!force && snap === lastHud) return;
    lastHud = snap;
    renderHud({
      health: Math.max(0, health),
      ammo: ammo,
      kills: kills,
      phase: phase,
      hit: hitFlash > 0,
    });
  }

  // ---------- Game loop ----------
  const fwd = new THREE.Vector3();
  const right = new THREE.Vector3();
  const up = new THREE.Vector3(0, 1, 0);
  let last = performance.now();

  function frame() {
    const now = performance.now();
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;

    if (phase === "play") {
      if (invuln > 0) invuln -= dt;
      if (fireCd > 0) fireCd -= dt;
      if (hitFlash > 0) hitFlash -= dt;
      if (shake > 0) shake -= dt;

      player.rotation.y = yaw;
      camera.rotation.x = pitch;
      camera.getWorldDirection(fwd);
      fwd.y = 0;
      if (fwd.lengthSq() > 0.0001) fwd.normalize();
      right.crossVectors(fwd, up).normalize();

      let mx = 0;
      let mz = 0;
      if (keys.has("KeyW") || keys.has("ArrowUp")) { mx += fwd.x; mz += fwd.z; }
      if (keys.has("KeyS") || keys.has("ArrowDown")) { mx -= fwd.x; mz -= fwd.z; }
      if (keys.has("KeyA") || keys.has("ArrowLeft")) { mx -= right.x; mz -= right.z; }
      if (keys.has("KeyD") || keys.has("ArrowRight")) { mx += right.x; mz += right.z; }

      const beforeX = player.position.x;
      const beforeZ = player.position.z;
      const len = Math.hypot(mx, mz);
      if (len > 0) {
        mx = (mx / len) * MOVE * dt;
        mz = (mz / len) * MOVE * dt;
        tryMove(mx, mz);
        bob += dt * 9;
      }
      void beforeX; void beforeZ;

      const bobY = len > 0 ? Math.sin(bob) * 0.035 : 0;
      const sx = shake > 0 ? (Math.random() - 0.5) * 0.04 : 0;
      const sy = shake > 0 ? (Math.random() - 0.5) * 0.03 : 0;
      camera.position.set(sx, bobY + sy, 0);

      if (keys.has("ControlLeft") || keys.has("ControlRight")) shoot();
      if (keys.has("Space")) openDoor();

      for (const d of doors.values()) {
        if (d.open > 0 && d.open < 1) {
          d.open = Math.min(1, d.open + dt * 1.6);
          d.mesh.position.y = WALL_H * 0.46 + d.open * 2.4;
          if (d.open > 0.72) d.solid = false;
        }
      }

      gun.position.z = -0.72 + (fireCd > 0.18 ? 0.08 : 0);
      gun.rotation.x = Math.sin(bob) * 0.02;
      if (fireCd < 0.2) {
        muzzle.visible = false;
        gunLight.intensity = 0;
      }

      for (const en of enemies) {
        if (!en.alive) continue;
        if (en.flash > 0) {
          en.flash -= dt;
          if (en.flash <= 0) en.body.emissive.setHex(0x1a0604);
        }
        const dx = player.position.x - en.x;
        const dz = player.position.z - en.z;
        const dist = Math.hypot(dx, dz);
        if (dist < 16 && dist > 1.05) {
          const nx = en.x + (dx / dist) * 1.7 * dt;
          const nz = en.z + (dz / dist) * 1.7 * dt;
          if (!blocked(nx, en.z)) en.x = nx;
          if (!blocked(en.x, nz)) en.z = nz;
          en.mesh.position.set(en.x, 0, en.z);
          en.mesh.lookAt(player.position.x, 0, player.position.z);
        }
        if (dist < 1.15 && invuln <= 0) {
          health -= 16 * dt;
          shake = Math.max(shake, 0.08);
          if (health <= 0) {
            health = 0;
            phase = "dead";
            pushHud(true);
          }
        }
      }
    } else {
      yaw += dt * 0.08;
      player.rotation.y = yaw;
      camera.rotation.x = -0.08;
    }

    pushHud(false);
    renderer.autoClear = true;
    renderer.render(scene, camera);
    renderer.autoClear = false;
    renderer.clearDepth();
    renderer.render(gunScene, gunCam);
    renderer.autoClear = true;
  }

  // ---------- Sizing ----------
  function resize() {
    const w = host.clientWidth || 1;
    const h = host.clientHeight || 1;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    gunCam.aspect = w / h;
    gunCam.updateProjectionMatrix();
    renderer.setSize(w, h);
  }
  new ResizeObserver(resize).observe(host);
  resize();

  // ---------- Input ----------
  renderer.domElement.addEventListener("mousemove", (e) => {
    if (phase !== "play") return;
    if (document.pointerLockElement === renderer.domElement || e.buttons === 1) {
      yaw -= e.movementX * LOOK;
      pitch -= e.movementY * LOOK;
      pitch = Math.max(-1.35, Math.min(1.35, pitch));
    }
  });

  let lastTX = null;
  let lastTY = null;
  renderer.domElement.addEventListener("touchstart", (e) => {
    if (e.touches.length === 1) {
      lastTX = e.touches[0].clientX;
      lastTY = e.touches[0].clientY;
    }
  }, { passive: true });
  renderer.domElement.addEventListener("touchmove", (e) => {
    if (phase !== "play" || lastTX == null || lastTY == null || e.touches.length !== 1) return;
    const x = e.touches[0].clientX;
    const y = e.touches[0].clientY;
    yaw -= (x - lastTX) * TOUCH_LOOK;
    pitch -= (y - lastTY) * TOUCH_LOOK;
    pitch = Math.max(-1.35, Math.min(1.35, pitch));
    lastTX = x;
    lastTY = y;
  }, { passive: true });
  renderer.domElement.addEventListener("touchend", () => {
    lastTX = null;
    lastTY = null;
  });
  renderer.domElement.addEventListener("click", () => {
    if (phase === "play" && matchMedia("(pointer: fine)").matches && renderer.domElement.requestPointerLock) {
      renderer.domElement.requestPointerLock();
    }
  });

  window.addEventListener("keydown", (e) => {
    keys.add(e.code);
    if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) e.preventDefault();
  });
  window.addEventListener("keyup", (e) => keys.delete(e.code));
  window.addEventListener("blur", () => keys.clear());

  function setHeld(code, down) {
    if (down) keys.add(code);
    else keys.delete(code);
    if (down && code === "ControlLeft") shoot();
    if (down && code === "Space") openDoor();
  }

  // Touch pad and buttons: any element with data-key
  document.querySelectorAll("[data-key]").forEach((el) => {
    const code = el.getAttribute("data-key");
    el.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      el.setPointerCapture(e.pointerId);
      setHeld(code, true);
    });
    el.addEventListener("pointerup", (e) => {
      setHeld(code, false);
      if (el.releasePointerCapture) el.releasePointerCapture(e.pointerId);
    });
    el.addEventListener("pointercancel", () => setHeld(code, false));
  });

  function start() {
    try { ac(); } catch (err) { /* audio is optional */ }
    reset();
    phase = "play";
    pushHud(true);
    if (matchMedia("(pointer: fine)").matches && renderer.domElement.requestPointerLock) {
      renderer.domElement.requestPointerLock();
    }
  }
  $("startBtn").addEventListener("click", start);

  // ---------- Go ----------
  pushHud(true);
  renderer.setAnimationLoop(frame);
})();
</script>
</body>
</html>
