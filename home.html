<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Home</title>
<style>
:root{
  --bg:#eceff4; --surface:#ffffff; --hover:#f5f8ff; --text:#131a26; --muted:#5d6879;
  --border:#d5dbe5; --accent:#1f5eff; --tile-l:40%;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0e141d; --surface:#17202d; --hover:#1d2839; --text:#e8edf5; --muted:#8f9bb0;
    --border:#263245; --accent:#6c9bff; --tile-l:46%;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font:16px/1.45 ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,sans-serif;
}
.top{
  position:sticky; top:0; z-index:5; background:var(--bg);
  border-bottom:1px solid var(--border);
  padding:max(.5rem,env(safe-area-inset-top)) .75rem .5rem;
}
.top-inner{max-width:72rem; margin:0 auto}
h1{margin:0; font-size:1.4rem; line-height:1.2; font-weight:800; letter-spacing:-.01em}
#status{margin:.05rem 0 .5rem; color:var(--muted); font-size:.9rem}
.tools{display:flex; gap:.5rem}
#q{
  flex:1; min-width:0; min-height:2.6rem; padding:0 .9rem; font:inherit;
  color:var(--text); background:var(--surface);
  border:1px solid var(--border); border-radius:12px;
}
#refresh{
  min-height:2.6rem; padding:0 1rem; font:inherit; font-weight:600; cursor:pointer;
  color:var(--accent); background:var(--surface);
  border:1px solid var(--border); border-radius:12px;
}
#refresh:hover{background:var(--hover)}
#q:focus-visible,#refresh:focus-visible,.btn:focus-visible,.notice button:focus-visible{
  outline:3px solid var(--accent); outline-offset:2px;
}
main{max-width:72rem; margin:0 auto; padding:.75rem .75rem max(1.5rem,env(safe-area-inset-bottom))}
.group{margin:0 0 1.1rem}
.group h2{
  margin:0 0 .5rem; padding-left:.55rem; font-size:1rem; font-weight:800;
  border-left:4px solid var(--accent);
}
.group h2 small{font-weight:600; color:var(--muted); font-size:.8rem; margin-left:.4rem}
.grid{
  display:grid; gap:.5rem;
  grid-template-columns:repeat(auto-fill,minmax(6.5rem,1fr));
}
.btn{
  position:relative; overflow:hidden; isolation:isolate;
  display:flex; align-items:center; justify-content:center; text-align:center;
  min-height:4.4rem; padding:.5rem;
  color:#fff; text-decoration:none;
  background:linear-gradient(145deg,var(--c1),var(--c2));
  border-radius:16px;
  box-shadow:0 3px 10px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.4);
  -webkit-tap-highlight-color:transparent;
}
.btn::before{
  content:""; position:absolute; inset:0 0 50% 0; z-index:-1;
  background:linear-gradient(rgba(255,255,255,.24),rgba(255,255,255,0));
}
.btn::after{
  content:attr(data-i); position:absolute; right:.3rem; bottom:-.6rem; z-index:-1;
  font-size:3.4rem; font-weight:900; line-height:1; color:rgba(255,255,255,.2);
}
.btn:hover{filter:brightness(1.12) saturate(1.1)}
.btn:active{transform:scale(.96)}
.btn:focus-visible{outline:3px solid var(--text); outline-offset:3px}
.label{
  display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:3; line-clamp:3;
  overflow:hidden; overflow-wrap:anywhere; hyphens:auto;
  font-weight:800; line-height:1.15; text-shadow:0 1px 2px rgba(0,0,0,.45);
}
.label.l{font-size:1rem}
.label.m{font-size:.88rem}
.label.s{font-size:.76rem}
.label.xs{font-size:.66rem}
.notice{
  max-width:34rem; padding:1rem 1.1rem; background:var(--surface);
  border:1px solid var(--border); border-left:5px solid var(--accent); border-radius:12px;
}
.notice h2{margin:0 0 .3rem; font-size:1.05rem}
.notice p{margin:0 0 .8rem; color:var(--muted)}
.notice button{
  min-height:2.6rem; padding:0 1rem; font:inherit; font-weight:600; cursor:pointer;
  color:#fff; background:var(--accent); border:0; border-radius:10px;
}
@media (min-width:40rem){
  .top,main{padding-left:1.25rem; padding-right:1.25rem}
  .top-inner{display:flex; align-items:center; gap:1.5rem}
  .top-inner .head{flex:1}
  #status{margin-bottom:0}
  .tools{width:22rem}
  .grid{grid-template-columns:repeat(auto-fill,minmax(9rem,1fr)); gap:.65rem}
  .btn{min-height:5.4rem}
  .label.l{font-size:1.15rem}
  .label.m{font-size:1rem}
  .label.s{font-size:.88rem}
  .label.xs{font-size:.76rem}
}
@media (prefers-reduced-motion:no-preference){
  .btn{transition:filter .15s,transform .1s}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="head">
      <h1>Home</h1>
      <p id="status" role="status" aria-live="polite">Scanning GitHub…</p>
    </div>
    <div class="tools">
      <input id="q" type="search" placeholder="Search pages" aria-label="Search pages" autocomplete="off">
      <button id="refresh" type="button">Rescan</button>
    </div>
  </div>
</header>
<main id="app"></main>
<noscript><main><div class="notice"><h2>JavaScript is off</h2><p>This page needs JavaScript to list the pages on the site.</p></div></main></noscript>

<script>
/* ---------- Settings: edit these ---------- */
const CONFIG = {
  user: 'bhupinderdeol',
  repo: 'bhupinderdeol.github.io',   // the user-site repository
  includeProjectRepos: false,         // true = also scan your other repos that have GitHub Pages turned on
  exclude: ['home.html', '404.html'], // file names to hide (matched in any folder)
  excludeDirs: ['node_modules', 'vendor', 'assets', 'includes', 'partials', 'templates'],
  cacheMinutes: 60,                   // GitHub allows 60 unauthenticated API calls per hour
  fallback: [                         // shown only if the scan fails: { title, url, group }
    // { title: 'Example', url: 'https://bhupinderdeol.github.io/example.html', group: 'Top level' }
  ]
};
/* ------------------------------------------ */

const SITE = `https://${CONFIG.user}.github.io`;
const API = 'https://api.github.com';
const CACHE_KEY = `home-pages:${CONFIG.user}:${CONFIG.includeProjectRepos}`;
const $ = s => document.querySelector(s);
const app = $('#app'), statusEl = $('#status'), search = $('#q');

const pretty = s => s.replace(/\.html?$/i, '')
  .replace(/([a-z])([A-Z])/g, '$1 $2')
  .replace(/[-_.]+/g, ' ').replace(/\s+/g, ' ').trim()
  .replace(/\b\w/g, c => c.toUpperCase());
const hue = s => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const PALETTE = [
  ['#ff3d71', '#ff8a00'], ['#7c3aed', '#ec4899'], ['#0ea5e9', '#2563eb'],
  ['#00b86b', '#0a8f7a'], ['#f59e0b', '#ef4444'], ['#06b6d4', '#7c3aed'],
  ['#e11d48', '#9333ea'], ['#14b8a6', '#2563eb'], ['#d946ef', '#6366f1'],
  ['#16a34a', '#0891b2'], ['#f43f5e', '#fb923c'], ['#8b5cf6', '#3b82f6']
];
const ago = t => {
  const m = Math.round((Date.now() - t) / 60000);
  return m < 1 ? 'just now' : m < 60 ? `${m} min ago` : `${Math.round(m / 60)} h ago`;
};
const setStatus = t => { statusEl.textContent = t; };

/* ---------- GitHub scan ---------- */
async function gh(path) {
  const r = await fetch(API + path, { headers: { Accept: 'application/vnd.github+json' } });
  if (r.status === 403 || r.status === 429) throw new Error('rate');
  return r;
}

async function fetchTree(repo) {
  for (const ref of ['HEAD', 'main', 'master']) {
    const r = await gh(`/repos/${CONFIG.user}/${repo}/git/trees/${ref}?recursive=1`);
    if (r.ok) return r.json();
  }
  throw new Error('tree');
}

async function listProjectRepos() {
  const r = await gh(`/users/${CONFIG.user}/repos?per_page=100&sort=updated`);
  if (!r.ok) return [];
  return (await r.json())
    .filter(x => x.has_pages && !x.archived && x.name !== CONFIG.repo)
    .map(x => x.name);
}

function toItems(tree, repo) {
  const isRoot = repo === CONFIG.repo;
  const base = isRoot ? `${SITE}/` : `${SITE}/${repo}/`;
  const enc = parts => parts.map(encodeURIComponent).join('/');
  return (tree.tree || [])
    .filter(n => n.type === 'blob' && /\.html?$/i.test(n.path))
    .flatMap(n => {
      const parts = n.path.split('/');
      const file = parts[parts.length - 1];
      const dirs = parts.slice(0, -1);
      if (CONFIG.exclude.includes(file.toLowerCase())) return [];
      if (dirs.some(d => d.startsWith('.') || CONFIG.excludeDirs.includes(d.toLowerCase()))) return [];
      const isIndex = /^index\.html?$/i.test(file);
      const title = isIndex
        ? (dirs.length ? pretty(dirs[dirs.length - 1]) : (isRoot ? 'Main site' : pretty(repo)))
        : pretty(file);
      const group = isRoot ? (dirs[0] ? pretty(dirs[0]) : 'Top level') : pretty(repo);
      const url = isIndex ? base + enc(dirs) + (dirs.length ? '/' : '') : base + enc(parts);
      return [{ title, group, path: (isRoot ? '' : repo + '/') + n.path, url }];
    });
}

/* ---------- Cache ---------- */
const readCache = () => {
  try {
    const c = JSON.parse(localStorage.getItem(CACHE_KEY));
    return c && Date.now() - c.t < CONFIG.cacheMinutes * 60000 ? c : null;
  } catch { return null; }
};
const writeCache = items => {
  try { localStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), items })); } catch {}
};

/* ---------- Render ---------- */
function button(item, k) {
  const a = document.createElement('a');
  a.className = 'btn';
  a.href = item.url;
  a.target = '_blank';
  a.rel = 'noopener noreferrer';
  a.title = item.path || item.url;
  a.dataset.q = `${item.title} ${item.path || item.url}`.toLowerCase();
  a.dataset.i = (item.title.match(/[a-z0-9]/i) || ['•'])[0].toUpperCase();

  const [c1, c2] = PALETTE[(k + hue(item.group || '')) % PALETTE.length];
  a.style.setProperty('--c1', c1);
  a.style.setProperty('--c2', c2);

  // Longer names get a smaller font so every tile fits
  const longest = Math.max(...item.title.split(' ').map(w => w.length));
  const n = item.title.length;
  const size = longest > 13 || n > 30 ? 'xs'
    : longest > 10 || n > 22 ? 's'
    : longest > 8 || n > 14 ? 'm' : 'l';

  const label = document.createElement('span');
  label.className = `label ${size}`;
  label.textContent = item.title;
  a.append(label);
  return a;
}

function render(items) {
  app.replaceChildren();
  if (!items.length) {
    notice('No pages found', `No .html files turned up in ${CONFIG.repo}. Add a page to the repository and rescan.`);
    return;
  }
  const groups = new Map();
  items.forEach(i => {
    const g = i.group || 'Top level';
    if (!groups.has(g)) groups.set(g, []);
    groups.get(g).push(i);
  });
  const names = [...groups.keys()].sort((a, b) =>
    a === 'Top level' ? -1 : b === 'Top level' ? 1 : a.localeCompare(b));

  names.forEach(name => {
    const sec = document.createElement('section');
    sec.className = 'group';
    const h = document.createElement('h2');
    const count = document.createElement('small');
    count.textContent = groups.get(name).length;
    h.append(name, count);
    const grid = document.createElement('div');
    grid.className = 'grid';
    groups.get(name)
      .sort((a, b) => a.title.localeCompare(b.title))
      .forEach((i, k) => grid.append(button(i, k)));
    sec.append(h, grid);
    app.append(sec);
  });

  const none = document.createElement('p');
  none.id = 'none';
  none.hidden = true;
  none.textContent = 'No pages match your search.';
  app.append(none);
  filter();
}

function notice(title, text, retry) {
  const box = document.createElement('div');
  box.className = 'notice';
  const h = document.createElement('h2');
  h.textContent = title;
  const p = document.createElement('p');
  p.textContent = text;
  box.append(h, p);
  if (retry) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = 'Try again';
    b.addEventListener('click', () => load(true));
    box.append(b);
  }
  app.append(box);
}

function filter() {
  const q = search.value.trim().toLowerCase();
  let shown = 0;
  app.querySelectorAll('.group').forEach(sec => {
    let any = 0;
    sec.querySelectorAll('.btn').forEach(b => {
      const hit = !q || b.dataset.q.includes(q);
      b.hidden = !hit;
      if (hit) any++;
    });
    sec.hidden = !any;
    shown += any;
  });
  const none = $('#none');
  if (none) none.hidden = shown > 0;
}

/* ---------- Load ---------- */
async function load(force) {
  setStatus('Scanning GitHub…');
  if (!force) {
    const c = readCache();
    if (c) {
      render(c.items);
      setStatus(`${CONFIG.user}.github.io: ${c.items.length} pages, scanned ${ago(c.t)}`);
      return;
    }
  }
  app.replaceChildren();
  try {
    const repos = [CONFIG.repo];
    if (CONFIG.includeProjectRepos) {
      try { repos.push(...await listProjectRepos()); } catch {}
    }
    const results = await Promise.allSettled(
      repos.map(r => fetchTree(r).then(t => toItems(t, r))));
    if (results[0].status === 'rejected') throw results[0].reason;

    const seen = new Set();
    const items = results
      .filter(r => r.status === 'fulfilled')
      .flatMap(r => r.value)
      .filter(i => !seen.has(i.url) && seen.add(i.url));

    writeCache(items);
    render(items);
    setStatus(`${CONFIG.user}.github.io: ${items.length} pages, scanned just now`);
  } catch (err) {
    const fb = CONFIG.fallback;
    setStatus('Could not scan GitHub');
    if (fb.length) {
      render(fb.map(i => ({ ...i, path: '' })));
      return;
    }
    notice(
      err.message === 'rate' ? 'GitHub paused the scan' : 'Couldn’t scan GitHub',
      err.message === 'rate'
        ? 'GitHub allows 60 anonymous requests an hour from one network. Wait a few minutes, then try again.'
        : 'Check your connection and the repository name in CONFIG, then try again.',
      true);
  }
}

search.addEventListener('input', filter);
$('#refresh').addEventListener('click', () => load(true));
load(false);
</script>
</body>
</html>
