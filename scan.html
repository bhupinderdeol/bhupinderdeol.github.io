<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Scan and clean</title>
<style>
:root{
  --bg:#eceff4; --surface:#ffffff; --hover:#f5f8ff; --text:#131a26; --muted:#5d6879;
  --border:#d5dbe5; --accent:#1f5eff; --tile-l:40%;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0e141d; --surface:#17202d; --hover:#1d2839; --text:#e8edf5; --muted:#8f9bb0;
    --border:#263245; --accent:#6c9bff; --tile-l:46%;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font:16px/1.45 ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,sans-serif;
}
.top{
  position:sticky; top:0; z-index:5; background:var(--bg);
  border-bottom:1px solid var(--border);
  padding:max(.5rem,env(safe-area-inset-top)) .75rem .5rem;
}
.top-inner{max-width:72rem; margin:0 auto}
h1{margin:0; font-size:1.4rem; line-height:1.2; font-weight:800; letter-spacing:-.01em}
#status{margin:.05rem 0 .5rem; color:var(--muted); font-size:.9rem}
.tools{display:flex; gap:.5rem}
#q{
  flex:1; min-width:0; min-height:2.6rem; padding:0 .9rem; font:inherit;
  color:var(--text); background:var(--surface);
  border:1px solid var(--border); border-radius:12px;
}
#refresh,#only404{
  min-height:2.6rem; padding:0 1rem; font:inherit; font-weight:600; cursor:pointer;
  color:var(--accent); background:var(--surface);
  border:1px solid var(--border); border-radius:12px;
}
#refresh:hover,#only404:hover{background:var(--hover)}
#q:focus-visible,#refresh:focus-visible,#only404:focus-visible,.btn:focus-visible,.notice button:focus-visible,.x:focus-visible,#yes:focus-visible,#no:focus-visible,#tok:focus-visible{
  outline:3px solid var(--accent); outline-offset:2px;
}
main{max-width:72rem; margin:0 auto; padding:.75rem .75rem max(1.5rem,env(safe-area-inset-bottom))}
.group{margin:0 0 1.1rem}
.group h2{
  margin:0 0 .5rem; padding-left:.55rem; font-size:1rem; font-weight:800;
  border-left:4px solid var(--accent);
}
.group h2 small{font-weight:600; color:var(--muted); font-size:.8rem; margin-left:.4rem}
.grid{
  display:grid; gap:.5rem;
  grid-template-columns:repeat(auto-fill,minmax(8.5rem,1fr));
}
.btn{
  position:relative; overflow:hidden; isolation:isolate;
  display:flex; align-items:center; justify-content:center; text-align:center;
  min-height:5rem; padding:.6rem;
  color:#fff; text-decoration:none;
  background:linear-gradient(145deg,var(--c1),var(--c2));
  border-radius:16px;
  box-shadow:0 3px 10px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.4);
  -webkit-tap-highlight-color:transparent;
}
.btn::before{
  content:""; position:absolute; inset:0 0 50% 0; z-index:-1;
  background:linear-gradient(rgba(255,255,255,.24),rgba(255,255,255,0));
}
.btn::after{
  content:attr(data-i); position:absolute; right:.3rem; bottom:-.6rem; z-index:-1;
  font-size:3.4rem; font-weight:900; line-height:1; color:rgba(255,255,255,.2);
}
.btn:hover{filter:brightness(1.12) saturate(1.1)}
.btn:active{transform:scale(.96)}
.btn:focus-visible{outline:3px solid var(--text); outline-offset:3px}
.label{
  display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:3; line-clamp:3;
  overflow:hidden; overflow-wrap:anywhere; hyphens:auto;
  font-weight:800; line-height:1.15; text-shadow:0 1px 2px rgba(0,0,0,.45);
}
.label.l{font-size:1.2rem}
.label.m{font-size:1.05rem}
.label.s{font-size:.9rem}
.label.xs{font-size:.78rem}
.notice{
  max-width:34rem; padding:1rem 1.1rem; background:var(--surface);
  border:1px solid var(--border); border-left:5px solid var(--accent); border-radius:12px;
}
.notice h2{margin:0 0 .3rem; font-size:1.05rem}
.notice p{margin:0 0 .8rem; color:var(--muted)}
.notice button{
  min-height:2.6rem; padding:0 1rem; font:inherit; font-weight:600; cursor:pointer;
  color:#fff; background:var(--accent); border:0; border-radius:10px;
}
#only404[aria-pressed="true"]{background:#e5173f; color:#fff; border-color:#e5173f}
.tile{position:relative; display:flex}
.tile .btn{flex:1; min-width:0; padding:1rem .6rem .6rem}
.x{
  position:absolute; top:.3rem; right:.3rem; z-index:2; width:2.1rem; height:2.1rem;
  display:grid; place-items:center; padding:0; border:0; border-radius:50%;
  font:inherit; font-size:1rem; font-weight:800; line-height:1; cursor:pointer;
  color:#fff; background:rgba(0,0,0,.5);
}
.x:hover{background:#e5173f}
.tile.bad .btn{outline:3px solid #ff2d55; outline-offset:-3px}
.tile.bad::after{
  content:"404"; position:absolute; top:.4rem; left:.4rem; z-index:2; padding:.1rem .45rem;
  border-radius:6px; background:#ff2d55; color:#fff; font-size:.72rem; font-weight:800;
}
.dlg{position:fixed; inset:0; z-index:20; display:grid; place-items:center; padding:1rem; background:rgba(5,8,14,.75)}
.dlg-box{
  width:min(100%,26rem); padding:1.1rem; background:var(--surface); color:var(--text);
  border:1px solid var(--border); border-top:5px solid #e5173f; border-radius:16px;
}
.dlg-box h2{margin:0 0 .4rem; font-size:1.15rem}
.dlg-box p{margin:.4rem 0; color:var(--muted); font-size:.9rem}
.dlg-box .dlg-path{color:var(--text); font-weight:700; font-size:1rem; overflow-wrap:anywhere}
#tokRow{display:block; margin-top:.7rem; font-weight:600; font-size:.9rem}
#tok{
  display:block; width:100%; margin-top:.3rem; min-height:2.6rem; padding:0 .8rem; font:inherit;
  color:var(--text); background:var(--bg); border:1px solid var(--border); border-radius:10px;
}
.dlg-box #dlgMsg{min-height:1.3rem; color:#ff4d6d; font-weight:600}
.dlg-btns{display:grid; grid-template-columns:1fr 1fr; gap:.6rem; margin-top:.8rem}
.dlg-btns button{min-height:3rem; font:inherit; font-weight:800; border:0; border-radius:12px; cursor:pointer}
#yes{background:#e5173f; color:#fff}
#yes:disabled{opacity:.6}
#no{background:var(--border); color:var(--text)}
@media (min-width:40rem){
  .top,main{padding-left:1.25rem; padding-right:1.25rem}
  .top-inner{display:flex; align-items:center; gap:1.5rem}
  .top-inner .head{flex:1}
  #status{margin-bottom:0}
  .tools{width:22rem}
  .grid{grid-template-columns:repeat(auto-fill,minmax(9rem,1fr)); gap:.65rem}
  .btn{min-height:5.4rem}
  .label.l{font-size:1.15rem}
  .label.m{font-size:1rem}
  .label.s{font-size:.88rem}
  .label.xs{font-size:.76rem}
}
@media (prefers-reduced-motion:no-preference){
  .btn{transition:filter .15s,transform .1s}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="head">
      <h1>Scan</h1>
      <p id="status" role="status" aria-live="polite">Scanning GitHub…</p>
    </div>
    <div class="tools">
      <input id="q" type="search" placeholder="Search pages" aria-label="Search pages" autocomplete="off">
      <button id="only404" type="button" aria-pressed="false">404 only</button>
      <button id="refresh" type="button">Rescan</button>
    </div>
  </div>
</header>
<main id="app"></main>
<noscript><main><div class="notice"><h2>JavaScript is off</h2><p>This page needs JavaScript to list the pages on the site.</p></div></main></noscript>

<div id="dlg" class="dlg" role="alertdialog" aria-modal="true" aria-labelledby="dlgTitle" hidden>
  <div class="dlg-box">
    <h2 id="dlgTitle">Delete this page?</h2>
    <p id="dlgPath" class="dlg-path"></p>
    <p>This removes the file from GitHub. It stays in the repo history, so you can restore it later.</p>
    <label id="tokRow" for="tok">GitHub token
      <input id="tok" type="password" autocomplete="off" placeholder="github_pat_…">
    </label>
    <p id="tokHelp">Use a fine-grained token for this repo with Contents: Read and write. It is kept only until you close this tab.</p>
    <p id="dlgMsg" role="alert"></p>
    <div class="dlg-btns">
      <button id="yes" type="button">Yes, delete (Y)</button>
      <button id="no" type="button">No (N)</button>
    </div>
  </div>
</div>

<script>
/* ---------- Settings: edit these ---------- */
const CONFIG = {
  user: 'bhupinderdeol',
  repo: 'bhupinderdeol.github.io',   // the user-site repository
  includeProjectRepos: false,         // true = also scan your other repos that have GitHub Pages turned on
  exclude: [],                        // file names to hide (404.html is shown here so you can remove it)
  protect: ['scan.html', 'home.html', 'index.html'], // paths that get no delete button
  excludeDirs: ['node_modules', 'vendor', 'assets', 'includes', 'partials', 'templates'],
  cacheMinutes: 60,                   // GitHub allows 60 unauthenticated API calls per hour
  fallback: [                         // shown only if the scan fails: { title, url, group }
    // { title: 'Example', url: 'https://bhupinderdeol.github.io/example.html', group: 'Top level' }
  ]
};
/* ------------------------------------------ */

const SITE = `https://${CONFIG.user}.github.io`;
const API = 'https://api.github.com';
const CACHE_KEY = `scan-pages:${CONFIG.user}:${CONFIG.includeProjectRepos}`;
const $ = s => document.querySelector(s);
const app = $('#app'), statusEl = $('#status'), search = $('#q');
let current = [], lastNote = '';

const pretty = s => s.replace(/\.html?$/i, '')
  .replace(/([a-z])([A-Z])/g, '$1 $2')
  .replace(/[-_.]+/g, ' ').replace(/\s+/g, ' ').trim()
  .replace(/\b\w/g, c => c.toUpperCase());
const hue = s => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const PALETTE = [
  ['#ff3d71', '#ff8a00'], ['#7c3aed', '#ec4899'], ['#0ea5e9', '#2563eb'],
  ['#00b86b', '#0a8f7a'], ['#f59e0b', '#ef4444'], ['#06b6d4', '#7c3aed'],
  ['#e11d48', '#9333ea'], ['#14b8a6', '#2563eb'], ['#d946ef', '#6366f1'],
  ['#16a34a', '#0891b2'], ['#f43f5e', '#fb923c'], ['#8b5cf6', '#3b82f6']
];
const ago = t => {
  const m = Math.round((Date.now() - t) / 60000);
  return m < 1 ? 'just now' : m < 60 ? `${m} min ago` : `${Math.round(m / 60)} h ago`;
};
const setStatus = t => { statusEl.textContent = t; };

/* ---------- GitHub scan ---------- */
async function gh(path) {
  const r = await fetch(API + path, { headers: { Accept: 'application/vnd.github+json' } });
  if (r.status === 403 || r.status === 429) throw new Error('rate');
  return r;
}

async function fetchTree(repo) {
  for (const ref of ['HEAD', 'main', 'master']) {
    const r = await gh(`/repos/${CONFIG.user}/${repo}/git/trees/${ref}?recursive=1`);
    if (r.ok) return r.json();
  }
  throw new Error('tree');
}

async function listProjectRepos() {
  const r = await gh(`/users/${CONFIG.user}/repos?per_page=100&sort=updated`);
  if (!r.ok) return [];
  return (await r.json())
    .filter(x => x.has_pages && !x.archived && x.name !== CONFIG.repo)
    .map(x => x.name);
}

function toItems(tree, repo) {
  const isRoot = repo === CONFIG.repo;
  const base = isRoot ? `${SITE}/` : `${SITE}/${repo}/`;
  const enc = parts => parts.map(encodeURIComponent).join('/');
  return (tree.tree || [])
    .filter(n => n.type === 'blob' && /\.html?$/i.test(n.path))
    .flatMap(n => {
      const parts = n.path.split('/');
      const file = parts[parts.length - 1];
      const dirs = parts.slice(0, -1);
      if (CONFIG.exclude.includes(file.toLowerCase())) return [];
      if (dirs.some(d => d.startsWith('.') || CONFIG.excludeDirs.includes(d.toLowerCase()))) return [];
      const isIndex = /^index\.html?$/i.test(file);
      const title = isIndex
        ? (dirs.length ? pretty(dirs[dirs.length - 1]) : (isRoot ? 'Main site' : pretty(repo)))
        : pretty(file);
      const group = isRoot ? (dirs[0] ? pretty(dirs[0]) : 'Top level') : pretty(repo);
      const url = isIndex ? base + enc(dirs) + (dirs.length ? '/' : '') : base + enc(parts);
      return [{ title, group, path: (isRoot ? '' : repo + '/') + n.path, url, repo, file: n.path }];
    });
}

/* ---------- Cache ---------- */
const readCache = () => {
  try {
    const c = JSON.parse(localStorage.getItem(CACHE_KEY));
    return c && Date.now() - c.t < CONFIG.cacheMinutes * 60000 ? c : null;
  } catch { return null; }
};
const writeCache = items => {
  try { localStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), items })); } catch {}
};

/* ---------- Render ---------- */
function button(item, k) {
  const a = document.createElement('a');
  a.className = 'btn';
  a.href = item.url;
  a.target = '_blank';
  a.rel = 'noopener noreferrer';
  a.title = item.path || item.url;
  a.dataset.q = `${item.title} ${item.path || item.url}`.toLowerCase();
  a.dataset.i = (item.title.match(/[a-z0-9]/i) || ['•'])[0].toUpperCase();

  const [c1, c2] = PALETTE[(k + hue(item.group || '')) % PALETTE.length];
  a.style.setProperty('--c1', c1);
  a.style.setProperty('--c2', c2);

  // Longer names get a smaller font so every tile fits
  const longest = Math.max(...item.title.split(' ').map(w => w.length));
  const n = item.title.length;
  const size = longest > 13 || n > 30 ? 'xs'
    : longest > 10 || n > 22 ? 's'
    : longest > 8 || n > 14 ? 'm' : 'l';

  const label = document.createElement('span');
  label.className = `label ${size}`;
  label.textContent = item.title;
  a.append(label);
  return a;
}

function render(items) {
  current = items;
  app.replaceChildren();
  if (!items.length) {
    notice('No pages found', `No .html files turned up in ${CONFIG.repo}. Add a page to the repository and rescan.`);
    return;
  }
  const groups = new Map();
  items.forEach(i => {
    const g = i.group || 'Top level';
    if (!groups.has(g)) groups.set(g, []);
    groups.get(g).push(i);
  });
  const names = [...groups.keys()].sort((a, b) =>
    a === 'Top level' ? -1 : b === 'Top level' ? 1 : a.localeCompare(b));

  names.forEach(name => {
    const sec = document.createElement('section');
    sec.className = 'group';
    const h = document.createElement('h2');
    const count = document.createElement('small');
    count.textContent = groups.get(name).length;
    h.append(name, count);
    const grid = document.createElement('div');
    grid.className = 'grid';
    groups.get(name)
      .sort((a, b) => a.title.localeCompare(b.title))
      .forEach((i, k) => grid.append(tile(i, k)));
    sec.append(h, grid);
    app.append(sec);
  });

  const none = document.createElement('p');
  none.id = 'none';
  none.hidden = true;
  none.textContent = 'No pages match your search.';
  app.append(none);
  filter();
  checkLinks();
}

function notice(title, text, retry) {
  const box = document.createElement('div');
  box.className = 'notice';
  const h = document.createElement('h2');
  h.textContent = title;
  const p = document.createElement('p');
  p.textContent = text;
  box.append(h, p);
  if (retry) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = 'Try again';
    b.addEventListener('click', () => load(true));
    box.append(b);
  }
  app.append(box);
}

function filter() {
  const q = search.value.trim().toLowerCase();
  const only = $('#only404').getAttribute('aria-pressed') === 'true';
  let shown = 0;
  app.querySelectorAll('.group').forEach(sec => {
    let any = 0;
    sec.querySelectorAll('.tile').forEach(t => {
      const hit = (!q || t.querySelector('.btn').dataset.q.includes(q)) && (!only || t.classList.contains('bad'));
      t.hidden = !hit;
      if (hit) any++;
    });
    sec.hidden = !any;
    shown += any;
  });
  const none = $('#none');
  if (none) none.hidden = shown > 0;
}

/* ---------- Tiles with a delete X ---------- */
const isProtected = i => CONFIG.protect.includes(i.path);

function tile(item, k) {
  const wrap = document.createElement('div');
  wrap.className = 'tile';
  wrap.dataset.url = item.url;
  wrap.append(button(item, k));
  if (item.file && !isProtected(item)) {
    const x = document.createElement('button');
    x.type = 'button';
    x.className = 'x';
    x.textContent = '✕';
    x.setAttribute('aria-label', `Delete ${item.path}`);
    x.addEventListener('click', () => askDelete(item, wrap));
    wrap.append(x);
  }
  return wrap;
}

function summary(note) {
  if (note) lastNote = note;
  const bad = app.querySelectorAll('.tile.bad').length;
  setStatus(`${CONFIG.user}.github.io: ${current.length} pages${bad ? `, ${bad} look broken` : ''}${lastNote ? `, ${lastNote}` : ''}`);
}

/* ---------- 404 check: marks pages that error or show a 404 title ---------- */
async function isBroken(url) {
  try {
    const r = await fetch(url, { cache: 'no-store' });
    if (!r.ok) return true;
    let head = '';
    if (r.body && r.body.getReader) {
      const rd = r.body.getReader(), dec = new TextDecoder();
      while (head.length < 20000 && !/<\/title>/i.test(head)) {
        const { done, value } = await rd.read();
        if (done) break;
        head += dec.decode(value, { stream: true });
      }
      rd.cancel().catch(() => {});
    } else {
      head = (await r.text()).slice(0, 20000);
    }
    const title = (head.match(/<title[^>]*>([\s\S]*?)<\/title>/i) || [])[1] || '';
    return /\b404\b|not found/i.test(title);
  } catch { return false; }
}

async function checkLinks() {
  const queue = [...app.querySelectorAll('.tile')];
  const worker = async () => {
    while (queue.length) {
      const t = queue.shift();
      if (await isBroken(t.dataset.url)) { t.classList.add('bad'); summary(); }
    }
  };
  await Promise.all(Array.from({ length: 6 }, worker));
  summary();
  filter();
}

/* ---------- Delete with y/n ---------- */
const dlg = $('#dlg'), tok = $('#tok'), msg = $('#dlgMsg'), yes = $('#yes');
let pending = null;
const getToken = () => { try { return sessionStorage.getItem('gh-token') || ''; } catch { return ''; } };
const saveToken = t => { try { sessionStorage.setItem('gh-token', t); } catch {} };
const clearToken = () => { try { sessionStorage.removeItem('gh-token'); } catch {} };
const showTokenBox = on => { $('#tokRow').hidden = !on; $('#tokHelp').hidden = !on; };

function askDelete(item, el) {
  pending = { item, el };
  $('#dlgPath').textContent = item.path;
  msg.textContent = '';
  tok.value = '';
  yes.disabled = false;
  showTokenBox(!getToken());
  dlg.hidden = false;
  (getToken() ? yes : tok).focus();
}

function closeDlg() { dlg.hidden = true; pending = null; }

function forget(item) {
  current = current.filter(i => i.url !== item.url);
  try {
    const c = JSON.parse(localStorage.getItem(CACHE_KEY));
    if (c) { c.items = c.items.filter(i => i.url !== item.url); localStorage.setItem(CACHE_KEY, JSON.stringify(c)); }
  } catch {}
}

async function doDelete() {
  if (!pending || yes.disabled) return;
  const { item, el } = pending;
  const token = getToken() || tok.value.trim();
  if (!token) { msg.textContent = 'Paste your GitHub token first.'; tok.focus(); return; }
  yes.disabled = true;
  msg.textContent = 'Deleting…';
  const url = `${API}/repos/${CONFIG.user}/${item.repo}/contents/${item.file.split('/').map(encodeURIComponent).join('/')}`;
  const headers = { Accept: 'application/vnd.github+json', Authorization: `Bearer ${token}`, 'X-GitHub-Api-Version': '2022-11-28' };
  try {
    let r = await fetch(url, { headers });
    if (!r.ok) throw r;
    const { sha } = await r.json();
    r = await fetch(url, {
      method: 'DELETE',
      headers: { ...headers, 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: `Delete ${item.file}`, sha })
    });
    if (!r.ok) throw r;
    saveToken(token);
    const sec = el.closest('.group');
    el.remove();
    if (!sec.querySelector('.tile')) sec.remove();
    else sec.querySelector('h2 small').textContent = sec.querySelectorAll('.tile').length;
    forget(item);
    closeDlg();
    summary('deleted ' + item.path);
  } catch (e) {
    const st = e && e.status;
    msg.textContent = st === 401 ? 'GitHub rejected the token. Check it and try again.'
      : st === 403 || st === 404 ? 'Not allowed, or the file is already gone. The token needs Contents: Read and write on this repo.'
      : st === 409 ? 'The file changed while deleting. Try again.'
      : 'Delete failed. Check your connection and try again.';
    if (st === 401) { clearToken(); showTokenBox(true); }
    yes.disabled = false;
  }
}

/* ---------- Load ---------- */
async function load(force) {
  setStatus('Scanning GitHub…');
  if (!force) {
    const c = readCache();
    if (c) {
      render(c.items);
      summary(`scanned ${ago(c.t)}`);
      return;
    }
  }
  app.replaceChildren();
  try {
    const repos = [CONFIG.repo];
    if (CONFIG.includeProjectRepos) {
      try { repos.push(...await listProjectRepos()); } catch {}
    }
    const results = await Promise.allSettled(
      repos.map(r => fetchTree(r).then(t => toItems(t, r))));
    if (results[0].status === 'rejected') throw results[0].reason;

    const seen = new Set();
    const items = results
      .filter(r => r.status === 'fulfilled')
      .flatMap(r => r.value)
      .filter(i => !seen.has(i.url) && seen.add(i.url));

    writeCache(items);
    render(items);
    summary('scanned just now');
  } catch (err) {
    const fb = CONFIG.fallback;
    setStatus('Could not scan GitHub');
    if (fb.length) {
      render(fb.map(i => ({ ...i, path: '' })));
      return;
    }
    notice(
      err.message === 'rate' ? 'GitHub paused the scan' : 'Couldn’t scan GitHub',
      err.message === 'rate'
        ? 'GitHub allows 60 anonymous requests an hour from one network. Wait a few minutes, then try again.'
        : 'Check your connection and the repository name in CONFIG, then try again.',
      true);
  }
}

search.addEventListener('input', filter);
$('#only404').addEventListener('click', e => {
  const b = e.currentTarget;
  b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') !== 'true');
  filter();
});
yes.addEventListener('click', doDelete);
$('#no').addEventListener('click', closeDlg);
dlg.addEventListener('click', e => { if (e.target === dlg) closeDlg(); });
document.addEventListener('keydown', e => {
  if (dlg.hidden) return;
  if (e.key === 'Escape') return closeDlg();
  if (document.activeElement === tok) { if (e.key === 'Enter') doDelete(); return; }
  const k = e.key.toLowerCase();
  if (k === 'y') doDelete(); else if (k === 'n') closeDlg();
});
$('#refresh').addEventListener('click', () => load(true));
load(false);
</script>
</body>
</html>
