<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🎬 Ultimate Media Player — Audio & Video FX</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<style>
    :root {
        --bg: #0f1115; --panel: #1d2128; --card: #242a33; --border: #2a2f38;
        --accent: #4a9eff; --accent-hi: #6cb2ff; --gold: #d4af37; 
        --muted: #9aa4b2; --text: #e8e8e8;
    }
    * { box-sizing: border-box; }
    body {
        font-family: system-ui, sans-serif; background: var(--bg); color: var(--text);
        margin: 0; padding: 20px; display: flex; flex-direction: column;
        align-items: center; min-height: 100vh;
    }
    h1 { font-size: 1.4rem; margin-bottom: 16px; }
    
    .layout {
        display: grid; grid-template-columns: 1fr 380px; gap: 20px;
        width: 100%; max-width: 1300px;
    }
    @media (max-width: 950px) { .layout { grid-template-columns: 1fr; } }

    /* --- Video Section --- */
    .video-container {
        background: #000; border-radius: 10px; overflow: hidden;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; flex-direction: column;
        position: relative;
    }
    
    /* Wrapper handles Mirror & Aspect Ratio */
    .video-wrapper {
        width: 100%; aspect-ratio: 16/9; background: #000;
        display: flex; justify-content: center; align-items: center;
        overflow: hidden; position: relative;
    }
    
    video {
        width: 100%; height: 100%; object-fit: contain; display: block;
        transition: filter 0.1s linear, transform 0.1s linear;
    }

    /* Controls */
    .controls {
        background: var(--panel); padding: 12px 16px; display: flex;
        align-items: center; gap: 12px; border-top: 1px solid var(--border);
    }
    .controls button {
        background: transparent; color: #fff; border: none; cursor: pointer;
        font-size: 1.2rem; padding: 5px;
    }
    .controls button:hover { color: var(--accent); }
    .time-display { font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
    
    .seek-bar {
        flex: 1; appearance: none; height: 6px; border-radius: 3px;
        background: var(--card); outline: none; cursor: pointer;
    }
    .seek-bar::-webkit-slider-thumb {
        appearance: none; width: 14px; height: 14px; border-radius: 50%;
        background: var(--accent); cursor: pointer;
    }

    /* --- Side Panel --- */
    .side-panel {
        display: flex; flex-direction: column; gap: 16px;
        max-height: calc(100vh - 100px); overflow-y: auto; padding-right: 8px;
    }
    .side-panel::-webkit-scrollbar { width: 6px; }
    .side-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    section {
        background: var(--panel); border: 1px solid var(--border);
        border-radius: 10px; padding: 16px;
    }
    h2 {
        font-size: 0.9rem; color: var(--gold); margin: 0 0 12px 0;
        text-transform: uppercase; letter-spacing: 0.08em;
        display: flex; justify-content: space-between; align-items: center;
    }

    /* UI Elements */
    .vol-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .vol-row input[type=range] { flex: 1; accent-color: var(--accent); }
    .upload-btn {
        width: 100%; background: var(--accent); color: #fff; border: none;
        padding: 10px; border-radius: 6px; cursor: pointer; font-weight: 600;
    }
    .upload-btn:hover { background: var(--accent-hi); }
    #fileInput { display: none; }

    canvas { width: 100%; height: 80px; display: block; border-radius: 6px; background: #111; }

    /* Grids for Sliders & Toggles */
    .grid-list { display: flex; flex-direction: column; gap: 8px; }
    .grid-item {
        display: flex; align-items: center; justify-content: space-between;
        background: var(--card); padding: 8px 10px; border-radius: 6px; font-size: 0.85rem;
    }
    .grid-item label { display: flex; align-items: center; gap: 8px; cursor: pointer; flex: 1; }
    .grid-item input[type=checkbox] { accent-color: var(--accent); }
    
    .grid-item select {
        background: #111; color: var(--text); border: 1px solid var(--border);
        border-radius: 4px; padding: 4px; font-size: 0.8rem; cursor: pointer;
    }

    /* EQ Grid */
    .eq-grid { display: flex; justify-content: space-between; gap: 8px; }
    .eq-band { display: flex; flex-direction: column; align-items: center; flex: 1; }
    .eq-band input { writing-mode: vertical-lr; direction: rtl; height: 80px; accent-color: var(--accent); }
    .eq-band span { font-size: 0.7rem; color: var(--muted); margin-top: 4px; }

    /* Video FX Sliders */
    .vid-slider-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 0.8rem;}
    .vid-slider-row input[type=range] { flex: 1; accent-color: var(--gold); }
    .vid-slider-row span { width: 60px; text-align: right; color: var(--muted); }
</style>
</head>
<body>

<h1>🎬 Ultimate Media Player</h1>
<input type="file" id="fileInput" accept="video/mp4,video/webm,video/ogg,audio/mpeg,.mp3">

<div class="layout">
    <!-- LEFT: VIDEO -->
    <div class="video-container">
        <div class="video-wrapper">
            <video id="video" crossorigin="anonymous"></video>
        </div>
        <div class="controls">
            <button id="playPause">▶</button>
            <span class="time-display" id="timeDisplay">0:00 / 0:00</span>
            <input type="range" id="seekBar" class="seek-bar" value="0" min="0" max="100" step="0.1">
            <button id="muteBtn">🔊</button>
        </div>
    </div>

    <!-- RIGHT: CONTROLS -->
    <div class="side-panel">
        
        <section>
            <h2>Load Media</h2>
            <button class="upload-btn" id="uploadBtn">📁 Choose File (Video/MP3)</button>
            <div class="vol-row" style="margin-top:12px;">
                <span>🔊</span>
                <input type="range" id="volumeSlider" min="0" max="100" value="50">
                <span id="volValue" style="font-size:0.8rem; width:30px;">50%</span>
            </div>
        </section>

        <section>
            <h2>Spectrum</h2>
            <canvas id="visualizer"></canvas>
        </section>

        <!-- VIDEO EFFECTS SECTION -->
        <section>
            <h2>Video Effects</h2>
            <div class="grid-list" style="margin-bottom: 12px;">
                <div class="grid-item">
                    <label><input type="checkbox" id="vid-grayscale"> Grayscale (B&W)</label>
                </div>
                <div class="grid-item">
                    <label><input type="checkbox" id="vid-sepia"> Sepia (Vintage)</label>
                </div>
                <div class="grid-item">
                    <label><input type="checkbox" id="vid-invert"> Invert Colors</label>
                </div>
                <div class="grid-item">
                    <label><input type="checkbox" id="vid-mirror"> Mirror (Flip H)</label>
                </div>
            </div>
            
            <div class="vid-slider-row">
                <label style="width:70px">Blur</label>
                <input type="range" id="vid-blur" min="0" max="10" step="0.5" value="0">
                <span id="val-blur">0px</span>
            </div>
            <div class="vid-slider-row">
                <label style="width:70px">Brightness</label>
                <input type="range" id="vid-brightness" min="0" max="200" step="1" value="100">
                <span id="val-brightness">100%</span>
            </div>
            <div class="vid-slider-row">
                <label style="width:70px">Contrast</label>
                <input type="range" id="vid-contrast" min="0" max="200" step="1" value="100">
                <span id="val-contrast">100%</span>
            </div>
            <div class="vid-slider-row">
                <label style="width:70px">Saturate</label>
                <input type="range" id="vid-saturate" min="0" max="300" step="1" value="100">
                <span id="val-saturate">100%</span>
            </div>
            <div class="vid-slider-row">
                <label style="width:70px">Hue Rotate</label>
                <input type="range" id="vid-hue" min="0" max="360" step="1" value="0">
                <span id="val-hue">0°</span>
            </div>
        </section>

        <section>
            <h2>Audio Equalizer</h2>
            <div class="eq-grid" id="eqGrid"></div>
        </section>

        <section>
            <h2>Audio Effects (18)</h2>
            <div class="grid-list" id="fxGrid"></div>
        </section>

    </div>
</div>

<script>
(function () {
    // --- DOM ELEMENTS ---
    const video = document.getElementById('video');
    const fileInput = document.getElementById('fileInput');
    const playPauseBtn = document.getElementById('playPause');
    const seekBar = document.getElementById('seekBar');
    const timeDisplay = document.getElementById('timeDisplay');
    const muteBtn = document.getElementById('muteBtn');
    const volumeSlider = document.getElementById('volumeSlider');

    // ==========================================
    // 1. AUDIO ENGINE SETUP (Tone.js)
    // ==========================================
    const master = new Tone.Gain(0.5).toDestination();
    
    const eqFilters = [100, 400, 1000, 4000, 10000].map(f => 
        new Tone.Filter({ type: 'peaking', frequency: f, Q: 1, gain: 0 })
    );
    eqFilters[0].chain(...eqFilters.slice(1), master);
    const eqLast = eqFilters[eqFilters.length - 1];

    const analyser = new Tone.Analyser({ type: 'fft', size: 128, smoothing: 0.85 });
    eqLast.connect(analyser);

    const chainInput = new Tone.Gain(1);
    let nativeMediaSource = null;

    function initAudioRouting() {
        if (nativeMediaSource) return;
        const rawContext = Tone.getContext().rawContext;
        nativeMediaSource = rawContext.createMediaElementSource(video);
        Tone.connect(nativeMediaSource, chainInput);
        video.muted = true; // Mute native, we hear Tone.js
    }

    // 18 Effects
    const EFFECTS = [
        { key:'distortion',       label:'Distortion',   param:'distortion', def:0.6, opts:[0.1,0.6,0.9] },
        { key:'bitcrusher',       label:'BitCrusher',   param:'bits',       def:6,   opts:[4,6,8,16] },
        { key:'chebyshev',        label:'Chebyshev',    param:'order',      def:3,   opts:[1,3,5,8] },
        { key:'pitchshift',       label:'PitchShift',   param:'pitch',      def:5,   opts:[-5,0,5,7,12] },
        { key:'frequencyshifter', label:'FreqShifter',  param:'frequency',  def:30,  opts:[10,30,100,300] },
        { key:'autowah',          label:'AutoWah',      param:'octaves',    def:6,   opts:[2,4,6,8] },
        { key:'autofilter',       label:'AutoFilter',   param:'depth',      def:0.7, opts:[0.3,0.7,1.0] },
        { key:'phaser',           label:'Phaser',       param:'frequency',  def:0.5, opts:[0.1,0.5,2,5] },
        { key:'chorus',           label:'Chorus',       param:'frequency',  def:1.5, opts:[0.5,1.5,3,6] },
        { key:'tremolo',          label:'Tremolo',      param:'frequency',  def:5,   opts:[1,5,8,12] },
        { key:'vibrato',          label:'Vibrato',      param:'depth',      def:0.1, opts:[0.02,0.1,0.2,0.4] },
        { key:'autopanner',       label:'AutoPanner',   param:'frequency',  def:1,   opts:[0.5,1,2,5] },
        { key:'stereowidener',    label:'StereoWiden',  param:'width',      def:0.7, opts:[0.3,0.7,0.9] },
        { key:'feedbackdelay',    label:'FbDelay',      param:'feedback',   def:0.3, opts:[0.1,0.3,0.5,0.7] },
        { key:'pingpongdelay',    label:'PingPong',     param:'feedback',   def:0.3, opts:[0.1,0.3,0.5,0.7] },
        { key:'freeverb',         label:'Freeverb',     param:'roomSize',   def:0.7, opts:[0.3,0.7,0.9] },
        { key:'jcreverb',         label:'JCReverb',     param:'roomSize',   def:0.5, opts:[0.3,0.5,0.9] },
        { key:'reverb',           label:'Reverb',       param:'decay',      def:2,   opts:[0.5,2,4,8] }
    ];
    const ORDER = EFFECTS.map(e => e.key);
    const fx = {};

    const FX_FACTORY = {
        distortion: () => new Tone.Distortion({ distortion: 0.6, wet: 0.4 }),
        bitcrusher: () => new Tone.BitCrusher({ bits: 6, wet: 0.4 }),
        chebyshev: () => new Tone.Chebyshev({ order: 3, wet: 0.4 }),
        pitchshift: () => new Tone.PitchShift({ pitch: 5, wet: 0.5 }),
        frequencyshifter: () => new Tone.FrequencyShifter({ frequency: 30, wet: 0.4 }),
        autowah: () => new Tone.AutoWah({ baseFrequency: 100, octaves: 6, wet: 0.5 }),
        autofilter: () => new Tone.AutoFilter({ frequency: 1, depth: 0.7, wet: 0.5 }).start(),
        phaser: () => new Tone.Phaser({ frequency: 0.5, octaves: 3 }),
        chorus: () => new Tone.Chorus({ frequency: 1.5, delayTime: 3.5, depth: 0.7, wet: 0.5 }).start(),
        tremolo: () => new Tone.Tremolo({ frequency: 5, depth: 0.5, wet: 0.5 }).start(),
        vibrato: () => new Tone.Vibrato({ frequency: 5, depth: 0.1, wet: 0.5 }),
        autopanner: () => new Tone.AutoPanner({ frequency: 1, depth: 0.8, wet: 0.5 }).start(),
        stereowidener: () => new Tone.StereoWidener({ width: 0.7, wet: 0.5 }),
        feedbackdelay: () => new Tone.FeedbackDelay({ delayTime: '8n', feedback: 0.3, wet: 0.4 }),
        pingpongdelay: () => new Tone.PingPongDelay({ delayTime: '8n', feedback: 0.3, wet: 0.4 }),
        freeverb: () => new Tone.Freeverb({ roomSize: 0.7, dampening: 3000, wet: 0.4 }),
        jcreverb: () => new Tone.JCReverb({ roomSize: 0.5, wet: 0.4 }),
        reverb: () => new Tone.Reverb({ decay: 2, wet: 0.4 })
    };

    function getEffect(key) {
        if (!fx[key]) {
            const node = FX_FACTORY[key]();
            const cfg = EFFECTS.find(e => e.key === key);
            const val = parseFloat(document.getElementById('sel-' + key).value);
            if (node[cfg.param] && typeof node[cfg.param] === 'object') node[cfg.param].value = val;
            else node[cfg.param] = val;
            fx[key] = node;
        }
        return fx[key];
    }

    function rebuildChain() {
        try { chainInput.disconnect(); } catch(e) {}
        Object.values(fx).forEach(n => { try { n.disconnect(); } catch(e) {} });

        const active = [];
        ORDER.forEach(id => {
            if (document.getElementById('chk-' + id).checked) active.push(getEffect(id));
        });

        if (active.length > 0) chainInput.chain(...active, eqFilters[0]);
        else chainInput.connect(eqFilters[0]);
    }

    // ==========================================
    // 2. VIDEO EFFECTS LOGIC (CSS Filters)
    // ==========================================
    function applyVideoEffects() {
        // Gather values
        const isGray = document.getElementById('vid-grayscale').checked;
        const isSepia = document.getElementById('vid-sepia').checked;
        const isInvert = document.getElementById('vid-invert').checked;
        const isMirror = document.getElementById('vid-mirror').checked;
        
        const blur = document.getElementById('vid-blur').value;
        const bright = document.getElementById('vid-brightness').value;
        const contrast = document.getElementById('vid-contrast').value;
        const saturate = document.getElementById('vid-saturate').value;
        const hue = document.getElementById('vid-hue').value;

        // Update text labels
        document.getElementById('val-blur').textContent = blur + 'px';
        document.getElementById('val-brightness').textContent = bright + '%';
        document.getElementById('val-contrast').textContent = contrast + '%';
        document.getElementById('val-saturate').textContent = saturate + '%';
        document.getElementById('val-hue').textContent = hue + '°';

        // Construct CSS Filter String
        let filterStr = `
            grayscale(${isGray ? 100 : 0}%)
            sepia(${isSepia ? 100 : 0}%)
            invert(${isInvert ? 100 : 0}%)
            blur(${blur}px)
            brightness(${bright}%)
            contrast(${contrast}%)
            saturate(${saturate}%)
            hue-rotate(${hue}deg)
        `;

        video.style.filter = filterStr;
        video.style.transform = isMirror ? 'scaleX(-1)' : 'scaleX(1)';
    }

    // Attach listeners for Video FX
    document.querySelectorAll('#vid-grayscale, #vid-sepia, #vid-invert, #vid-mirror, #vid-blur, #vid-brightness, #vid-contrast, #vid-saturate, #vid-hue').forEach(el => {
        el.addEventListener('input', applyVideoEffects);
    });


    // ==========================================
    // 3. BUILD UI
    // ==========================================
    
    // Audio Effects Grid
    const fxGrid = document.getElementById('fxGrid');
    EFFECTS.forEach(cfg => {
        const div = document.createElement('div');
        div.className = 'grid-item';
        div.innerHTML = `
            <label>
                <input type="checkbox" id="chk-${cfg.key}" onchange="rebuildChain()">
                <span>${cfg.label}</span>
            </label>
            <select id="sel-${cfg.key}" onchange="updateFx('${cfg.key}','${cfg.param}',this.value)">
                ${cfg.opts.map(o => `<option value="${o}" ${o===cfg.def?'selected':''}>${o}</option>`).join('')}
            </select>
        `;
        fxGrid.appendChild(div);
    });

    // EQ Grid
    const eqGrid = document.getElementById('eqGrid');
    [100, 400, 1000, 4000, 10000].forEach((freq, i) => {
        const div = document.createElement('div');
        div.className = 'eq-band';
        div.innerHTML = `
            <input type="range" min="-12" max="12" value="0" id="eq-${i}" oninput="updateEq(${i}, this.value)">
            <span>${freq >= 1000 ? freq/1000+'k' : freq}</span>
        `;
        eqGrid.appendChild(div);
    });

    window.updateFx = (key, param, val) => {
        if (fx[key]) {
            if (fx[key][param] && typeof fx[key][param] === 'object') fx[key][param].value = parseFloat(val);
            else fx[key][param] = parseFloat(val);
        }
    };
    window.updateEq = (i, val) => eqFilters[i].gain.rampTo(parseFloat(val), 0.05);
    window.rebuildChain = rebuildChain;

    // ==========================================
    // 4. MEDIA CONTROLS
    // ==========================================
    document.getElementById('uploadBtn').addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        video.src = URL.createObjectURL(file);
        video.load();
        video.play();
        initAudioRouting();
        Tone.start();
    });

    playPauseBtn.addEventListener('click', async () => {
        await Tone.start();
        initAudioRouting();
        if (video.paused) video.play();
        else video.pause();
    });

    video.addEventListener('play', () => { playPauseBtn.textContent = '⏸'; });
    video.addEventListener('pause', () => { playPauseBtn.textContent = '▶'; });

    video.addEventListener('timeupdate', () => {
        if (!video.duration) return;
        seekBar.value = (video.currentTime / video.duration) * 100;
        
        const curM = Math.floor(video.currentTime / 60);
        const curS = Math.floor(video.currentTime % 60).toString().padStart(2, '0');
        const durM = Math.floor(video.duration / 60);
        const durS = Math.floor(video.duration % 60).toString().padStart(2, '0');
        timeDisplay.textContent = `${curM}:${curS} / ${durM}:${durS}`;
    });

    seekBar.addEventListener('input', () => {
        if (!video.duration) return;
        video.currentTime = (seekBar.value / 100) * video.duration;
    });

    // Volume (Tone.js)
    volumeSlider.addEventListener('input', () => {
        const v = parseFloat(volumeSlider.value);
        document.getElementById('volValue').textContent = v + '%';
        master.gain.rampTo(v / 100, 0.05);
    });

    // Mute
    muteBtn.addEventListener('click', () => {
        if (master.gain.value > 0) {
            master.gain.value = 0;
            volumeSlider.value = 0;
            document.getElementById('volValue').textContent = '0%';
            muteBtn.textContent = '🔇';
        } else {
            master.gain.value = 0.5;
            volumeSlider.value = 50;
            document.getElementById('volValue').textContent = '50%';
            muteBtn.textContent = '🔊';
        }
    });

    // ==========================================
    // 5. VISUALIZER
    // ==========================================
    const canvas = document.getElementById('visualizer');
    const ctx = canvas.getContext('2d');
    
    function resizeCanvas() {
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width * window.devicePixelRatio;
        canvas.height = rect.height * window.devicePixelRatio;
    }
    window.addEventListener('resize', resizeCanvas);
    setTimeout(resizeCanvas, 100);

    function draw() {
        requestAnimationFrame(draw);
        if (!canvas.width) return;
        
        const W = canvas.width, H = canvas.height;
        ctx.clearRect(0, 0, W, H);
        
        const vals = analyser.getValue();
        const N = vals.length;
        const barW = W / N;
        
        for (let i = 0; i < N; i++) {
            const norm = Math.max(0, Math.min(1, (vals[i] + 90) / 90));
            const h = norm * H * 0.9;
            
            const grad = ctx.createLinearGradient(0, H - h, 0, H);
            grad.addColorStop(0, '#6cb2ff');
            grad.addColorStop(1, '#4a9eff');
            
            ctx.fillStyle = grad;
            ctx.fillRect(i * barW + 1, H - h, barW - 2, h);
        }
    }
    draw();

    applyVideoEffects(); // Initialize default video filters
})();
</script>
</body>
</html>
